<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title>Portal-Download</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5d6677; --line: #dde1e8;
  --accent: #2456c7; --accent-text: #ffffff; --ok: #1d7a46; --bad: #b3261e; --warn: #a15c00;
  --chip-bad: #fde7e6; --chip-warn: #fff1dc; --chip-ok: #e3f4ea; --chip: #eef1f6;
  --radius: 8px; --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171c; --panel: #1c2027; --text: #e6e9ef; --muted: #9aa3b2; --line: #2e343e;
    --accent: #6c9bff; --accent-text: #0d1220; --ok: #5cc98b; --bad: #ff8a80; --warn: #ffb74d;
    --chip-bad: #3a1f1f; --chip-warn: #3a2d17; --chip-ok: #1b3326; --chip: #262b34;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--accent); }
#app { display: grid; grid-template-columns: 1fr minmax(320px, 25%); height: 100vh; }
#stage { position: relative; overflow: auto; border-right: 1px solid var(--line); }
#bar { background: var(--panel); overflow: auto; display: flex; flex-direction: column; }
@media (max-width: 800px) {
  #app { grid-template-columns: 1fr; grid-template-rows: auto auto; height: auto; }
  #bar { order: -1; border-bottom: 1px solid var(--line); }
  #stage { min-height: 70vh; border-right: 0; }
}
.pad { padding: 20px 24px; }
h1 { font-size: 20px; margin: 0 0 12px; }
h2 { font-size: 16px; margin: 20px 0 8px; }
h3 { font-size: 15px; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); padding: 7px 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.btn.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
.btn.bad { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.link { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; }
.btn.icon { padding: 6px 10px; }
.btn.wide { width: 100%; }
.chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: var(--chip); }
.chip.bad { background: var(--chip-bad); color: var(--bad); }
.chip.warn { background: var(--chip-warn); color: var(--warn); }
.chip.ok { background: var(--chip-ok); color: var(--ok); }
label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
input[type=text], input[type=url], input[type=number], input[type=date], input[type=password], input[type=email], textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg);
}
textarea { min-height: 140px; resize: vertical; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
input[type=checkbox] { transform: scale(1.15); margin-right: 6px; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--chip); }
tr.current td { background: var(--chip); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin: 0 0 12px; }

/* work bar */
.bar-head { padding: 12px 16px; border-bottom: 1px solid var(--line); }
.bar-head .app { font-weight: 700; }
.bar-nav { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.bar-body { padding: 14px 16px; flex: 1; }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.pager .pos { color: var(--muted); font-size: 13px; }
.field { display: flex; gap: 6px; align-items: center; margin: 6px 0; }
.field .k { width: 92px; color: var(--muted); font-size: 13px; flex: none; }
.field .v { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; padding: 5px 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
.instructions { border-left: 3px solid var(--accent); padding: 2px 0 2px 12px; margin: 12px 0; }
.instructions :first-child { margin-top: 0; }
.instructions :last-child { margin-bottom: 0; }
.finish { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
#toast { position: fixed; left: 16px; bottom: 16px; max-width: min(420px, calc(100vw - 32px)); z-index: 30; display: flex; flex-direction: column; gap: 8px; }
#toast div { background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: var(--radius); box-shadow: 0 4px 16px rgba(0,0,0,.2); }
#toast div.err { background: var(--bad); color: #fff; }

/* stage */
#portal { position: absolute; inset: 36px 0 0 0; width: 100%; height: calc(100% - 36px); border: 0; background: #fff; }
#portal-strip { position: absolute; top: 0; left: 0; right: 0; height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--panel); font-size: 13px; }
#loading { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--muted); }
.spinner { width: 18px; height: 18px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-right: 10px; }
@keyframes spin { to { transform: rotate(360deg); } }
.secret-once { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; word-break: break-all; background: var(--chip-warn); padding: 10px; border-radius: var(--radius); }

/* modal */
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
#modal[hidden] { display: none; }
#modal .box { background: var(--panel); border-radius: 12px; padding: 22px 24px; width: min(460px, 100%); max-height: 90vh; overflow: auto; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <main id="stage">
    <div id="loading"><div class="spinner"></div>Lädt …</div>
    <div id="portal-strip" hidden></div>
    <iframe id="portal" hidden title="Portal"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads allow-modals"
      referrerpolicy="no-referrer"></iframe>
    <section id="view"></section>
  </main>
  <aside id="bar"></aside>
</div>
<div id="modal" hidden><div class="box" id="modal-box"></div></div>
<div id="toast" aria-live="polite"></div>
<script>
"use strict";
/* Portal-Download – the whole application. Form and hydration only: every piece of content
   arrives through the API. Vendored libraries: none. */

// ------------------------------------------------------------------ helpers
const $ = (s) => document.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v; // only for HTML the service sanitized
    else if (v === true) el.setAttribute(k, "");
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
function toast(msg, isError) {
  const d = h("div", { class: isError ? "err" : "" }, msg);
  $("#toast").append(d);
  setTimeout(() => d.remove(), isError ? 9000 : 3500);
}
function fail(e) { console.error(e); toast(e.message || String(e), true); }
const fmtDate = (iso) => { if (!iso) return "–"; const d = new Date(iso.length === 10 ? iso + "T00:00:00" : iso); return d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" }); };
const fmtDateTime = (iso) => iso ? new Date(iso).toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" }) : "–";
function urgency(days) {
  if (days < 0) return h("span", { class: "chip bad" }, `überfällig seit ${-days} ${-days === 1 ? "Tag" : "Tagen"}`);
  if (days === 0) return h("span", { class: "chip warn" }, "heute fällig");
  if (days === 1) return h("span", { class: "chip warn" }, "morgen fällig");
  return h("span", { class: "chip" }, `fällig in ${days} Tagen`);
}
const outcomeChip = (o) => o === "succeeded" ? h("span", { class: "chip ok" }, "hat geklappt") : h("span", { class: "chip bad" }, "hat nicht geklappt");
function guessDeviceLabel() {
  const ua = navigator.userAgent;
  const b = /Edg\//.test(ua) ? "Edge" : /Firefox\//.test(ua) ? "Firefox" : /Chrome\//.test(ua) ? "Chrome" : /Safari\//.test(ua) ? "Safari" : "Browser";
  const o = /Windows/.test(ua) ? "Windows" : /Android/.test(ua) ? "Android" : /iPhone|iPad/.test(ua) ? "iOS" : /Mac OS/.test(ua) ? "macOS" : /Linux/.test(ua) ? "Linux" : "";
  return o ? `${b} auf ${o}` : b;
}
async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); }
  catch { const t = h("textarea", {}, text); document.body.append(t); t.select(); document.execCommand("copy"); t.remove(); }
  if (btn) { const old = btn.textContent; btn.textContent = "Kopiert ✓"; setTimeout(() => (btn.textContent = old), 1500); }
}

// ------------------------------------------------------------------ API
let CONFIG = { app_name: "Portal-Download", api: "api/" };
let seq = 0;
async function rpc(method, params = {}, headers = {}) {
  const res = await fetch(CONFIG.api, {
    method: "POST", credentials: "same-origin",
    headers: { "Content-Type": "application/json", ...headers },
    body: JSON.stringify({ jsonrpc: "2.0", method, params, id: ++seq }),
  });
  let body;
  try { body = await res.json(); } catch { throw new Error(`Der Dienst antwortet nicht verständlich (HTTP ${res.status}).`); }
  if (body.error) { const e = new Error(body.error.message); e.code = body.error.code; e.type = body.error.data && body.error.data.type; throw e; }
  return body.result;
}

// ------------------------------------------------------------------ vault (browser only)
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const VERIFIER_TEXT = "portal-download vault check";
const vault = { meta: null, key: null };

function idb() {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open("portal-download", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("keys");
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
async function idbDo(mode, fn) {
  const db = await idb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("keys", mode);
    const req = fn(tx.objectStore("keys"));
    tx.oncomplete = () => { db.close(); resolve(req && req.result); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  });
}
async function deriveKey(passphrase, saltB64, iterations) {
  const base = await crypto.subtle.importKey("raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: unb64(saltB64), iterations }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function seal(key, purpose, plain) {
  if (!plain) return "";
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv, additionalData: enc.encode(purpose) }, key, enc.encode(plain));
  return JSON.stringify({ v: 1, iv: b64(iv), ct: b64(ct) });
}
async function unseal(key, purpose, sealed) {
  if (!sealed) return "";
  const o = JSON.parse(sealed);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(o.iv), additionalData: enc.encode(purpose) }, key, unb64(o.ct));
  return dec.decode(pt);
}
async function keyFits(key) {
  try { return (await unseal(key, "verifier", vault.meta.verifier)) === VERIFIER_TEXT; } catch { return false; }
}
async function loadVault() {
  vault.meta = await rpc("vault.get");
  vault.key = null;
  if (!vault.meta.exists) return;
  try {
    const stored = await idbDo("readonly", (s) => s.get("vault"));
    if (stored && stored.salt === vault.meta.salt && (await keyFits(stored.key))) vault.key = stored.key;
  } catch (e) { console.warn("vault cache unavailable", e); }
}
async function rememberKey(key) {
  try { await idbDo("readwrite", (s) => s.put({ salt: vault.meta.salt, key }, "vault")); }
  catch (e) { toast("Der Schlüssel konnte in diesem Browser nicht gespeichert werden; nach dem Neuladen muss die Passphrase erneut eingegeben werden.", true); }
}
async function lockVault() {
  vault.key = null;
  try { await idbDo("readwrite", (s) => s.delete("vault")); } catch {}
  decrypted.clear();
  toast("Tresor gesperrt.");
  render();
}
const decrypted = new Map(); // sealed username + sealed password -> {username, password}
async function credsOf(job) {
  if (!vault.key) return null;
  const k = job.username_sealed + "\n" + job.password_sealed;
  if (decrypted.has(k)) return decrypted.get(k);
  try {
    const c = { username: await unseal(vault.key, "username", job.username_sealed), password: await unseal(vault.key, "password", job.password_sealed) };
    decrypted.set(k, c);
    return c;
  } catch { return { error: true }; }
}

function modal(build) {
  const box = $("#modal-box");
  box.replaceChildren(...build(() => { $("#modal").hidden = true; }));
  $("#modal").hidden = false;
  const first = box.querySelector("input"); if (first) first.focus();
}
function vaultDialog() {
  if (!vault.meta) return;
  if (!vault.meta.exists) {
    modal((close) => {
      const p1 = h("input", { type: "password", autocomplete: "new-password" });
      const p2 = h("input", { type: "password", autocomplete: "new-password" });
      const go = h("button", { class: "btn primary", type: "submit" }, "Tresor anlegen");
      return [h("form", { onsubmit: async (ev) => {
        ev.preventDefault();
        if (p1.value.length < 12) return toast("Die Passphrase braucht mindestens 12 Zeichen.", true);
        if (p1.value !== p2.value) return toast("Die beiden Eingaben stimmen nicht überein.", true);
        go.disabled = true;
        try {
          const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
          const key = await deriveKey(p1.value, salt, 600000);
          vault.meta = await rpc("vault.create", { salt, iterations: 600000, verifier: await seal(key, "verifier", VERIFIER_TEXT) });
          vault.key = key; await rememberKey(key); close(); toast("Tresor angelegt."); render();
        } catch (e) {
          if (e.type === "vault_exists") { close(); toast("Inzwischen hat jemand anderes den Tresor angelegt; gib dessen Passphrase ein.", true); await loadVault(); vaultDialog(); return; }
          go.disabled = false; fail(e);
        }
      } },
        h("h1", {}, "Tresor anlegen"),
        h("p", { class: "muted small" }, "Benutzernamen und Passwörter der Portale werden in diesem Browser mit einem Schlüssel aus dieser Passphrase verschlüsselt. Der Dienst speichert nur Verschlüsseltes und kennt die Passphrase nicht. Alle im Kreis verwenden dieselbe Passphrase – gebt sie persönlich weiter, nicht über diesen Dienst. Geht sie verloren, sind die gespeicherten Zugangsdaten nicht mehr lesbar."),
        h("label", {}, "Passphrase (mindestens 12 Zeichen)"), p1,
        h("label", {}, "Passphrase wiederholen"), p2,
        h("div", { class: "row", style: "margin-top:16px" }, go, h("button", { class: "btn", type: "button", onclick: close }, "Später")))];
    });
    return;
  }
  modal((close) => {
    const p = h("input", { type: "password", autocomplete: "current-password" });
    const go = h("button", { class: "btn primary", type: "submit" }, "Entsperren");
    return [h("form", { onsubmit: async (ev) => {
      ev.preventDefault(); go.disabled = true;
      try {
        const key = await deriveKey(p.value, vault.meta.salt, vault.meta.iterations);
        if (!(await keyFits(key))) { go.disabled = false; return toast("Die Passphrase passt nicht zu diesem Tresor.", true); }
        vault.key = key; await rememberKey(key); close(); render();
      } catch (e) { go.disabled = false; fail(e); }
    } },
      h("h1", {}, "Tresor entsperren"),
      h("p", { class: "muted small" }, "Gib die gemeinsame Passphrase ein. Dieser Browser merkt sich den daraus abgeleiteten Schlüssel, bis du sperrst oder der Browser seine Daten löscht."),
      h("label", {}, "Passphrase"), p,
      h("div", { class: "row", style: "margin-top:16px" }, go, h("button", { class: "btn", type: "button", onclick: close }, "Später")))];
  });
}

// ------------------------------------------------------------------ state & routing
const state = { status: null, me: null, jobs: [], today: null, current: 0, running: null, importReport: null };

function route() {
  const f = location.hash.replace(/^#/, "");
  if (f.startsWith("invite=")) {
    let token = "";
    try { token = decodeURIComponent(f.slice(7)); } catch {}
    return { view: "invite", token };
  }
  const parts = f.replace(/^\//, "").split("/").filter(Boolean);
  const id = parts[1] ? Number(parts[1]) : null;
  if (parts[1] && !Number.isInteger(id)) return { view: "work", id: null };
  return { view: parts[0] || "work", id };
}
function go(fragment) { if (location.hash !== fragment) location.hash = fragment; else render(); }
window.addEventListener("hashchange", () => render());

async function loadJobs() {
  const r = await rpc("job.list");
  state.jobs = r.jobs; state.today = r.today;
  const live = new Set(state.jobs.map((j) => j.username_sealed + "\n" + j.password_sealed));
  for (const k of [...decrypted.keys()]) if (!live.has(k)) decrypted.delete(k);
  if (state.current >= state.jobs.length) state.current = Math.max(0, state.jobs.length - 1);
}
const currentJob = () => state.jobs[state.current] || null;
function selectJob(id) {
  const i = state.jobs.findIndex((j) => j.job_id === id);
  if (i >= 0) state.current = i;
}

// ------------------------------------------------------------------ portal (left side)
let portalWindow = null;
function openPortalWindow(url) {
  const w = Math.round((screen.availWidth || 1280) * 0.75), hgt = screen.availHeight || 800;
  const win = window.open("", "pd-portal", `popup=yes,width=${w},height=${hgt},left=${screen.availLeft || 0},top=${screen.availTop || 0}`);
  if (!win) { toast("Das Fenster wurde blockiert. Erlaube Pop-ups für diese Seite und klicke erneut auf „Ausführen“.", true); return; }
  // A new window is still about:blank and ours: cut the way back before loading the portal.
  // A window reused from an earlier run is on the portal's origin; there opener is not ours to set.
  try { win.opener = null; } catch {}
  try { win.location.href = url; } catch { toast("Das Portal-Fenster ließ sich nicht umlenken; schließe es und klicke erneut auf „Ausführen“.", true); return; }
  try { win.focus(); } catch {}
  portalWindow = win;
}
function run(job) {
  state.running = job.job_id;
  if (!job.embeddable) openPortalWindow(job.entry_url);
  go(`#/run/${job.job_id}`);
}
function showPortal(job) {
  const strip = $("#portal-strip"), frame = $("#portal");
  strip.replaceChildren(
    h("strong", {}, job.title), h("span", { class: "muted grow", style: "overflow:hidden;text-overflow:ellipsis;white-space:nowrap" }, job.entry_url),
    h("button", { class: "btn link", onclick: () => openPortalWindow(job.entry_url) }, "im eigenen Fenster öffnen"),
    h("button", { class: "btn link", onclick: () => { state.running = null; go(`#/job/${job.job_id}`); } }, "schließen"));
  strip.hidden = false; frame.hidden = false;
  if (frame.dataset.url !== job.entry_url) { frame.src = job.entry_url; frame.dataset.url = job.entry_url; }
}
function hidePortal() {
  $("#portal-strip").hidden = true; const f = $("#portal"); f.hidden = true;
  if (f.dataset.url) { f.removeAttribute("src"); delete f.dataset.url; }
}

// ------------------------------------------------------------------ work bar (right side)
function renderBar() {
  const bar = $("#bar");
  const me = state.me;
  const nav = [
    h("a", { href: "#/" }, "Übersicht"), " · ", h("a", { href: "#/new" }, "Neuer Vorgang"),
    me.is_admin ? [" · ", h("a", { href: "#/people" }, "Personen")] : null, " · ", h("a", { href: "#/devices" }, "Meine Geräte"),
  ];
  const vaultCtl = !vault.meta ? null : vault.key
    ? h("button", { class: "btn link small", onclick: lockVault }, "Tresor sperren")
    : h("button", { class: "btn link small", onclick: vaultDialog }, vault.meta.exists ? "Tresor entsperren" : "Tresor anlegen");
  const head = h("div", { class: "bar-head" },
    h("div", { class: "row" }, h("span", { class: "app grow" }, CONFIG.app_name), h("span", { class: "muted small" }, me.name)),
    h("div", { class: "bar-nav small" }, nav, " · ", vaultCtl));
  const body = h("div", { class: "bar-body" });
  const job = currentJob();
  if (!job) {
    body.append(h("p", { class: "muted" }, "Noch keine Download-Vorgänge."), h("a", { class: "btn primary", href: "#/new" }, "Ersten Vorgang anlegen"));
  } else {
    body.append(renderCurrent(job));
  }
  bar.replaceChildren(head, body);
}

function renderCurrent(job) {
  const n = state.jobs.length;
  const pager = h("div", { class: "pager" },
    h("button", { class: "btn icon", title: "dringlicher", "aria-label": "vorheriger Vorgang", disabled: state.current === 0, onclick: () => { state.current--; go(`#/job/${currentJob().job_id}`); } }, "◀"),
    h("span", { class: "pos" }, `${state.current + 1} von ${n}`),

          const ab = pick.value;
          if (!confirm(`Agent ${a.display} das Recht „${abilityName[ab] || ab}“ geben?\n\nGib es nur frei, wenn dir der Agent genau diese Kennung genannt hat.`)) return;
          try { await rpc("agent.grant", { agent_id: a.agent_id, ability: ab }); if (ab === "backup.read") showBackupLine(a.display); else render(); } catch (e) { fail(e); }
        } }, "Freigeben"),
        h("button", { class: "btn small", onclick: act(() => rpc("agent.revoke", { agent_id: a.agent_id }), `Anmeldung ${a.display} ablehnen?`) }, "Ablehnen"));
    } else if (a.state === "granted") {
      controls = h("div", { class: "row small", style: "margin-top:8px" },
        h("button", { class: "btn small", onclick: act(() => rpc("agent.revoke", { agent_id: a.agent_id }), `Agent ${a.display} sofort widerrufen?`) }, "Widerrufen"));
    }
    return h("div", { class: "card" },
      h("div", { class: "row" },
        h("h3", { class: "grow" }, h("code", {}, a.display), " ", stateChip(a.state), " ", a.ability ? h("span", { class: "chip" }, abilityName[a.ability] || a.ability) : null),
        h("span", { class: "muted small" }, a.state === "pending" || a.state === "granted" ? `verfällt ${fmtDateTime(a.expires_at)}` : "")),
      h("p", { class: "small", style: "margin:6px 0 0" }, a.introduction),
      h("p", { class: "muted small", style: "margin:4px 0 0" },
        `angemeldet ${fmtDateTime(a.created_at)}`, a.granted_by ? ` · freigegeben von ${a.granted_by}` : "", ` · ${a.last_used_at ? "zuletzt " + fmtDateTime(a.last_used_at) : "nie benutzt"}`),
      controls);
  };
  const live = ag.agents.filter((a) => a.state === "pending" || a.state === "granted"), done = ag.agents.filter((a) => !live.includes(a));
  const purpose = h("input", { type: "text", placeholder: "z. B. NAS: nächtliches Backup" });
  const newAbility = h("select", {}, ag.abilities.map((x) => h("option", { value: x.ability, title: x.permits, selected: x.ability === "backup.read" }, abilityName[x.ability] || x.ability)));
  const createForm = h("form", { class: "card", onsubmit: async (ev) => {
    ev.preventDefault();
    if (!confirm(`Token mit dem Recht „${abilityName[newAbility.value] || newAbility.value}“ anlegen?`)) return;
    try { showToken(await rpc("agent.create", { introduction: purpose.value, ability: newAbility.value })); } catch (e) { fail(e); }
  } }, h("h3", {}, "Token anlegen"),
    h("p", { class: "muted small", style: "margin-top:0" }, "Für ein Skript, das sich nicht selbst anmelden kann, z. B. das nächtliche Backup."),
    h("div", { class: "row" }, h("div", { class: "grow" }, h("label", {}, "Wofür"), purpose), h("div", {}, h("label", {}, "Recht"), newAbility)),
    h("div", { style: "margin-top:10px" }, h("button", { class: "btn primary", type: "submit" }, "Token anlegen")));
  const agents = [
    h("p", { class: "muted small" }, "Agenten melden sich selbst an und nennen dir eine Kennung aus acht Buchstaben. Gib jeder Anmeldung genau ein Recht. Portal-Logins sieht kein Agent; nur das Recht „Backup holen“ bekommt sie versiegelt mit."),
    createForm,
    live.length ? live.map(agentCard) : h("p", { class: "muted small" }, "Keine aktiven Agenten."),
    done.length ? h("details", {}, h("summary", { class: "small muted" }, `${done.length} abgelaufen oder widerrufen`), done.map(agentCard)) : null,
  ];
  const file = h("input", { type: "file", accept: ".jsonl,application/jsonl,text/plain" }), omit = h("input", { type: "checkbox" });
  const backup = h("div", { class: "card" },
    h("p", { class: "small", style: "margin-top:0" }, "Das Backup enthält alles: Vorgänge mit Verlauf, Tresor, Personen und Zugänge. Logins nur versiegelt – ohne die Tresor-Passphrase sind sie unlesbar."),
    h("a", { class: "btn", href: backupUrl(), download: "" }, "Backup herunterladen"),
    h("form", { style: "margin-top:14px", onsubmit: async (ev) => {
      ev.preventDefault();
      const f = file.files[0]; if (!f) { toast("Wähle zuerst eine Backup-Datei.", true); return; }
      if (!confirm("Backup einlesen? Es wird nichts überschrieben: Vorhandenes kommt als „… (Import Datum)“ dazu.")) return;
      try { state.importReport = await rpc("backup.import", { jsonl: await f.text(), include_access: !omit.checked }); go("#/import"); } catch (e) { fail(e); }
    } },
      h("label", {}, "Backup einlesen (wird hinzugefügt)"), file,
      h("label", { style: "color:var(--text)" }, omit, "Personen und Zugänge weglassen (nur Vorgänge, Verlauf und Tresor)"),
      h("div", { style: "margin-top:10px" }, h("button", { class: "btn primary", type: "submit" }, "Einlesen"))));
  return h("div", { class: "pad", style: "max-width:900px" }, h("h1", {}, "Personen"), inviteForm, people, h("h2", {}, "Agenten"), agents, h("h2", {}, "Backup"), backup);
}

function viewImport() {
  const r = state.importReport;
  if (!r) return h("div", { class: "pad" }, h("h1", {}, "Import"), h("p", { class: "muted" }, "In dieser Sitzung wurde nichts eingelesen. Eingelesene Doppel tragen „(Import Datum)“ im Namen."));
  const vault = { adopted: "Tresor aus dem Backup übernommen – es gilt dessen Passphrase.", same: "Gleicher Tresor – die Logins funktionieren.", different: "Anderer Tresor – Logins aus dem Backup wurden weggelassen.", none: "Kein Tresor im Backup." }[r.vault] || r.vault;
  const rows = r.renamed.map((x) => {
    const tr = h("tr", {}, h("td", {}, x.kind === "job" ? "Vorgang" : "Person"), h("td", {}, x.name));
    const del = h("button", { class: "btn small", onclick: async () => {
      if (!confirm(`„${x.name}“ löschen?`)) return;
      try {
        if (x.kind === "job") await rpc("job.delete", { job_id: x.job_id }); else await rpc("user.delete", { user_id: x.user_id });
        x.deleted = true; tr.lastChild.replaceChildren(h("span", { class: "chip" }, "gelöscht")); await loadJobs(); renderBar();
      } catch (e) { fail(e); }
    } }, "Löschen");
    tr.append(h("td", {}, x.deleted ? h("span", { class: "chip" }, "gelöscht") : del));
    return tr;
  });
  return h("div", { class: "pad", style: "max-width:900px" },
    h("h1", {}, "Import"),
    h("p", {}, `${r.jobs_added} Vorgänge, ${r.runs_added} Läufe, ${r.people_added} Personen, ${r.devices_added} Geräte, ${r.agents_added} Tokens hinzugefügt.`),
    h("p", { class: "small" }, vault, r.logins_dropped ? ` ${r.logins_dropped} Logins weggelassen.` : ""),
    r.renamed.length
      ? [h("h2", {}, "Schon vorhanden – als Kopie hinzugefügt"), h("p", { class: "muted small" }, "Lösche, was du nicht brauchst."), h("table", { class: "small" }, h("tbody", {}, rows))]
      : h("p", { class: "muted" }, "Nichts davon war schon vorhanden."));
}

// ------------------------------------------------------------------ entry states without access
function viewInvite(token) {
  const label = h("input", { type: "text", required: true, maxlength: 80, value: guessDeviceLabel() });
  const btn = h("button", { class: "btn primary", type: "submit" }, "Einladung auf diesem Gerät annehmen");
  return h("form", { class: "pad", style: "max-width:520px", onsubmit: async (ev) => {
    ev.preventDefault(); btn.disabled = true;
    try {
      const r = await rpc("invitation.redeem", { token, label: label.value });
      history.replaceState(null, "", location.pathname + "#/");
      toast(`Willkommen, ${r.name}.`);
      await boot();
    } catch (e) { btn.disabled = false; fail(e); }
  } },
    h("h1", {}, "Einladung annehmen"),
    h("p", {}, "Dieses Gerät bekommt einen eigenen Zugang. Den Link kannst du auf jedem deiner Geräte öffnen."),
    h("label", {}, "Wie soll dieses Gerät heißen?"), label,
    h("div", { style: "margin-top:16px" }, btn));
}

function viewSetup() {
  const secret = h("input", { type: "password", required: true, autocomplete: "off" }), name = h("input", { type: "text", required: true }), email = h("input", { type: "email" });
  return h("form", { class: "pad", style: "max-width:560px", onsubmit: async (ev) => {
    ev.preventDefault();
    try {
      const r = await rpc("setup.createAdmin", { name: name.value, email: email.value }, { "X-Setup-Secret": secret.value.trim() });
      location.hash = "#invite=" + encodeURIComponent(r.invitation_token);
    } catch (e) { fail(e); }
  } },
    h("h1", {}, "Einrichtung"),
    h("p", {}, "Portal-Download ist noch nicht eingerichtet. Das Setup-Geheimnis steht in der Datei bootstrap.toml im Zustandsverzeichnis des Dienstes und, solange niemand eingerichtet ist, auch in der Log-Zeile beim Start. Es gilt 30 Minuten; ein Neustart oder „portal-download bootstrap“ erzeugt ein neues."),
    h("label", {}, "Setup-Geheimnis"), secret,
    h("label", {}, "Dein Name"), name,
    h("label", {}, "E-Mail (optional)"), email,
    h("div", { style: "margin-top:16px" }, h("button", { class: "btn primary", type: "submit" }, "Ersten Zugang anlegen")));
}

function viewNoAccess(err) {
  return h("div", { class: "pad", style: "max-width:560px" },
    h("h1", {}, CONFIG.app_name),
    h("p", {}, "Auf diesem Gerät besteht kein Zugang. Öffne den Einladungslink, den du bekommen hast; er funktioniert auf jedem deiner Geräte."),
    err ? h("p", { class: "muted small" }, err) : null,
    h("p", { class: "muted small" }, "Keinen Link (mehr)? Frag eine Person im Kreis, die Personen verwalten darf, nach einer neuen Einladung."));
}

// ------------------------------------------------------------------ render
let renderSeq = 0;
async function render() {
  const mySeq = ++renderSeq;
  const r = route();
  const view = $("#view");
  if (r.view === "invite") { hidePortal(); $("#bar").replaceChildren(); view.replaceChildren(viewInvite(r.token)); return; }
  if (!state.me) {
    hidePortal(); $("#bar").replaceChildren();
    view.replaceChildren(state.status && state.status.setup_required ? viewSetup() : viewNoAccess(state.authError));
    return;
  }
  // Others in the circle may have closed or changed jobs: fetch the list on every navigation.
  try { await loadJobs(); } catch (e) {
    if (mySeq !== renderSeq) return;
    if (e.code === 401) { state.me = null; state.authError = e.message; return render(); }
    fail(e);
  }
  if (mySeq !== renderSeq) return;
  if (r.id && ["job", "run", "edit", "history"].includes(r.view)) selectJob(r.id);
  renderBar();
  let content = null;
  try {
    if (r.view === "run") {
      const job = state.jobs.find((j) => j.job_id === r.id);
      content = job ? viewRunning(job) : viewOverview();
      if (!job || !job.embeddable) hidePortal();
    } else {
      hidePortal();
      if (r.view === "new") content = await viewEdit(null);
      else if (r.view === "edit") content = await viewEdit(r.id);
      else if (r.view === "history") content = await viewHistory(r.id);
      else if (r.view === "people") content = await viewPeople();
      else if (r.view === "import") content = viewImport();
      else if (r.view === "devices") content = await viewDevices();
      else content = viewOverview();
    }
  } catch (e) {
    if (mySeq !== renderSeq) return;
    if (e.code === 401) { state.me = null; state.authError = e.message; return render(); }
    fail(e); content = viewOverview();
  }
  if (mySeq !== renderSeq) return; // a newer render has started
  view.replaceChildren(...(content ? [content] : []));
}

async function boot() {
  try {
    try { CONFIG = { ...CONFIG, ...(await (await fetch("config.json", { cache: "no-cache" })).json()) }; } catch {}
    document.title = CONFIG.app_name;
    state.status = await rpc("service.status");
    state.me = state.status.me && state.status.me.kind === "person" ? state.status.me : null;
    if (state.me) {
      await Promise.all([loadJobs(), loadVault()]);
      if (vault.meta && (!vault.meta.exists || !vault.key)) vaultDialog();
    }
  } catch (e) {
    state.authError = e.message;
    fail(e);
  } finally {
    $("#loading").hidden = true;
  }
  await render();
}

if (!window.isSecureContext || !window.crypto || !crypto.subtle) {
  $("#loading").replaceChildren("Diese Seite braucht HTTPS (oder localhost), damit Verschlüsselung und Zwischenablage im Browser funktionieren. Bitte über die HTTPS-Adresse des Dienstes öffnen.");
} else {
  boot();
}
</script>
</body>
</html>
