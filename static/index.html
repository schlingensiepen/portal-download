<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' width='512' height='512'%3E %3Crect x='0' y='0' width='512' height='512' rx='110' fill='#1B5BA6'/%3E %3Cpath d='M 120,300 L 380,300 A 70,70 0 0,0 380,160 A 100,100 0 0,0 190,140 A 82,82 0 0,0 120,300 Z' fill='#1B5BA6' stroke='#3CC2B0' stroke-width='48' stroke-linejoin='round'/%3E %3Cpath d='M 216,210 L 296,210 L 296,330 L 356,330 L 256,450 L 156,330 L 216,330 Z' fill='#FFFFFF' stroke='#1B5BA6' stroke-width='28' stroke-linejoin='round' paint-order='stroke'/%3E %3C/svg%3E">
<title>Portal-Download</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5d6677; --line: #dde1e8;
  --accent: #2456c7; --accent-text: #ffffff; --ok: #1d7a46; --bad: #b3261e; --warn: #a15c00;
  --chip-bad: #fde7e6; --chip-warn: #fff1dc; --chip-ok: #e3f4ea; --chip: #eef1f6;
  --radius: 8px; --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171c; --panel: #1c2027; --text: #e6e9ef; --muted: #9aa3b2; --line: #2e343e;
    --accent: #6c9bff; --accent-text: #0d1220; --ok: #5cc98b; --bad: #ff8a80; --warn: #ffb74d;
    --chip-bad: #3a1f1f; --chip-warn: #3a2d17; --chip-ok: #1b3326; --chip: #262b34;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--accent); }
#app { display: grid; grid-template-columns: 1fr minmax(320px, 25%); height: 100vh; }
#stage { position: relative; overflow: auto; border-right: 1px solid var(--line); }
#bar { background: var(--panel); overflow: auto; display: flex; flex-direction: column; }
@media (max-width: 800px) {
  #app { grid-template-columns: 1fr; grid-template-rows: auto auto; height: auto; }
  #bar { order: -1; border-bottom: 1px solid var(--line); }
  #stage { min-height: 70vh; border-right: 0; }
}
.pad { padding: 20px 24px; }
h1 { font-size: 20px; margin: 0 0 12px; }
h2 { font-size: 16px; margin: 20px 0 8px; }
h3 { font-size: 15px; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); padding: 7px 12px; cursor: pointer; text-decoration: none; color: inherit; display: inline-block; }
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.btn.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
.btn.bad { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.link { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; }
.btn.icon { padding: 6px 10px; }
.btn.wide { width: 100%; }
.chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: var(--chip); }
.chip.bad { background: var(--chip-bad); color: var(--bad); }
.chip.warn { background: var(--chip-warn); color: var(--warn); }
.chip.ok { background: var(--chip-ok); color: var(--ok); }
label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
label.check { color: var(--text); }
input[type=text], input[type=url], input[type=number], input[type=date], input[type=password], input[type=email], textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg);
}
textarea { min-height: 140px; resize: vertical; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
textarea.note { min-height: 60px; font-family: var(--font); }
input[type=checkbox] { transform: scale(1.15); margin-right: 6px; }
select { padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); }
select.lang { padding: 2px 4px; font-size: 12px; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--chip); }
tr.current td { background: var(--chip); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin: 0 0 12px; }
.card.alert { border-color: var(--bad); }
.space { margin-top: 16px; }
.narrow { max-width: 560px; }
.medium { max-width: 760px; }
.wide-page { max-width: 900px; }
.pre { white-space: pre-line; }
input.invalid { border-color: var(--bad); outline: 1px solid var(--bad); }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* work bar */
.bar-head { padding: 12px 16px; border-bottom: 1px solid var(--line); }
.bar-head .app { font-weight: 700; }
.bar-nav { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.bar-body { padding: 14px 16px; flex: 1; }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.pager .pos { color: var(--muted); font-size: 13px; }
.field { display: flex; gap: 6px; align-items: center; margin: 6px 0; }
.field .k { width: 92px; color: var(--muted); font-size: 13px; flex: none; }
.field .v { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; padding: 5px 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
.instructions { border-left: 3px solid var(--accent); padding: 2px 0 2px 12px; margin: 12px 0; }
.instructions :first-child { margin-top: 0; }
.instructions :last-child { margin-bottom: 0; }
.finish { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
#toast { position: fixed; left: 16px; bottom: 16px; max-width: min(420px, calc(100vw - 32px)); z-index: 30; display: flex; flex-direction: column; gap: 8px; }
#toast div { background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: var(--radius); box-shadow: 0 4px 16px rgba(0,0,0,.2); }
#toast div.err { background: var(--bad); color: #fff; }

/* stage */
.card.done { border-color: var(--ok); }
#loading { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--muted); padding: 24px; }
.spinner { width: 18px; height: 18px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-right: 10px; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.secret-once { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; word-break: break-all; background: var(--chip-warn); padding: 10px; border-radius: var(--radius); }

/* modal */
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
#modal .box { background: var(--panel); border-radius: 12px; padding: 22px 24px; width: min(460px, 100%); max-height: 90vh; overflow: auto; }
[hidden] { display: none !important; }
</style>
<body>
<div id="app">
  <main id="stage">
    <div id="loading"><div class="spinner"></div><span data-ref="text" data-i18n="app.loading">Loading …</span></div>
    <section id="view"></section>
  </main>
  <aside id="bar"></aside>
</div>
<div id="modal" hidden><div class="box" id="modal-box" role="dialog" aria-modal="true"></div></div>
<div id="toast" aria-live="polite"></div>

<!-- ================================================================ building blocks
     Every piece of the interface is here, in English. The script clones a block, fills
     [data-field] with textContent, shows or hides [data-ref] parts and binds [data-action].
     A text carries a data-i18n attribute naming its key; other languages replace the
     text from i18n/<code>.json. -->

<!-- texts the script needs on its own: toasts, questions, chips, short phrases -->
<template id="messages"><div>

  <span data-msg="urgency.overdue.other" class="chip bad" data-i18n="urgency.overdue.other">overdue by <span data-field="n"></span> days</span>

  <span data-msg="outcome.failed" class="chip bad" data-i18n="outcome.failed">failed</span>

  <span data-msg="retry.one" data-i18n="retry.one">· after a failure, due again in 1 day</span>
  <span data-msg="retry.other" data-i18n="retry.other">· after a failure, due again in <span data-field="n"></span> days</span>
  <span data-msg="last.by" data-i18n="last.by"><span data-field="when"></span> by <span data-field="by"></span></span>
  <span data-msg="weeks.short" data-i18n="weeks.short"><span data-field="n"></span> wk.</span>
  <span data-msg="toast.saved" data-i18n="toast.saved">Saved.</span>
  <span data-msg="toast.created" data-i18n="toast.created">Created.</span>
  <span data-msg="toast.deleted" data-i18n="toast.deleted">Deleted.</span>
  <span data-msg="toast.welcome" data-i18n="toast.welcome">Welcome, <span data-field="name"></span>.</span>
  <span data-msg="toast.popup_blocked" data-i18n="toast.popup_blocked">The new tab was blocked. Allow pop-ups for this page and click “Open the portal” again.</span>
  <span data-msg="toast.popup_redirect" data-i18n="toast.popup_redirect">The portal could not be loaded in the new tab; close it and click “Open the portal” again.</span>
  <span data-msg="toast.choose_file" data-i18n="toast.choose_file">Choose a file first.</span>
  <span data-msg="toast.password_short" data-i18n="toast.password_short">A password for the file needs 8 to 200 characters: letters A to Z, digits, punctuation and spaces, no umlauts, no space at either end.</span>
  <span data-msg="toast.not_encrypted" data-i18n="toast.not_encrypted">The service did not encrypt the file; nothing was saved.</span>
  <span data-msg="toast.imported" data-i18n="toast.imported">Read in – added: <span data-field="added"></span>, updated: <span data-field="updated"></span>, reactivated: <span data-field="reactivated"></span>, replaced: <span data-field="replaced"></span>, left out: <span data-field="skipped"></span>, runs added: <span data-field="runs"></span>.</span>
  <span data-msg="toast.imported_people" data-i18n="toast.imported_people">People added: <span data-field="people"></span>, devices: <span data-field="devices"></span>, tokens: <span data-field="agents"></span>. Already there, added with “(Import …)”: <span data-field="renamed"></span>.</span>
  <span data-msg="confirm.finish.succeeded" data-i18n="confirm.finish.succeeded">Close “<span data-field="title"></span>” as “succeeded”?</span>
  <span data-msg="confirm.finish.failed" data-i18n="confirm.finish.failed">Close “<span data-field="title"></span>” as “failed”?</span>

  <span data-msg="confirm.device.other" data-i18n="confirm.device.other">Revoke “<span data-field="label"></span>”?</span>
  <span data-msg="confirm.person.device" data-i18n="confirm.person.device">Revoke the device “<span data-field="label"></span>” of <span data-field="name"></span>?</span>
  <span data-msg="confirm.person.rights" data-i18n="confirm.person.rights">Set the rights of <span data-field="name"></span> to: <span data-field="rights"></span>?</span>
  <span data-msg="confirm.person.deactivate" data-i18n="confirm.person.deactivate">Deactivate <span data-field="name"></span> on all devices?</span>
  <span data-msg="confirm.invitation.withdraw" data-i18n="confirm.invitation.withdraw">Withdraw the invitation? Devices already signed in stay signed in.</span>
  <span data-msg="confirm.agent.grant" data-i18n="confirm.agent.grant">Give agent <span data-field="display"></span> the role “<span data-field="role"></span>”? Grant it only if the agent told you exactly this display string.</span>
  <span data-msg="confirm.agent.grant_people" data-i18n="confirm.agent.grant_people">This role lets the agent invite people. It could open such an invitation itself and then work as a person of the circle, with every login.</span>
  <span data-msg="confirm.agent.grant_agents" data-i18n="confirm.agent.grant_agents">This role lets the agent grant waiting registrations, also ones that are not its user's: it must grant only the display string its user names.</span>
  <span data-msg="agent.created" data-i18n="agent.created">· tokens granted: <span data-field="tokens"></span>, people invited: <span data-field="people"></span>; revoking this one leaves them as they are</span>
  <span data-msg="confirm.person.delete" data-i18n="confirm.person.delete">Delete <span data-field="name"></span> with all invitations and devices? Their closed runs keep the name.</span>
  <span data-msg="confirm.agent.reject" data-i18n="confirm.agent.reject">Reject the registration <span data-field="display"></span>?</span>
  <span data-msg="confirm.agent.revoke" data-i18n="confirm.agent.revoke">Revoke agent <span data-field="display"></span> at once?</span>
  <span data-msg="confirm.token.create" data-i18n="confirm.token.create">Create a token with the role “<span data-field="role"></span>”?</span>
  <span data-msg="confirm.export.plain" data-i18n="confirm.export.plain">Without a password the file holds every login in plain text. Download it anyway?</span>
  <span data-msg="confirm.import" data-i18n="confirm.import">Read the file in with the choices shown?</span>
  <span data-msg="confirm.lang.discard" data-i18n="confirm.lang.discard">Switching the language discards what you entered here. Switch anyway?</span>

  <span data-msg="logins.bad_file" data-i18n="logins.bad_file">This file is not a login export of Firefox: its first line lacks the columns url, username and password.</span>
  <span data-msg="logins.summary" data-i18n="logins.summary">Logins in the file: <span data-field="n"></span> · combined as duplicates: <span data-field="dupes"></span> · already a job: <span data-field="existing"></span></span>
  <span data-msg="toast.logins.none" data-i18n="toast.logins.none">Tick at least one login first.</span>

<!-- work bar, right side -->

<template id="tpl-bar-empty"><div>
  <p class="muted" data-i18n="bar.empty">No download jobs yet.</p>
  <a class="btn primary" href="#/new" data-i18n="bar.first">Create the first job</a>
</div></template>

<template id="tpl-current"><div>
  <div class="pager">
    <button class="btn icon" type="button" data-action="prev" title="more urgent" data-i18n-title="pager.prev_title" aria-label="previous job" data-i18n-aria-label="pager.prev">◀</button>
    <span class="pos" data-i18n="pager.pos"><span data-field="pos"></span> of <span data-field="n"></span></span>
    <button class="btn icon" type="button" data-action="next" title="less urgent" data-i18n-title="pager.next_title" aria-label="next job" data-i18n-aria-label="pager.next">▶</button>
  </div>
  <h1 data-field="title"></h1>
  <div class="card done" data-ref="done">
    <strong data-i18n="current.done">Closed – due again on <span data-field="next_due"></span>.</strong>
    <div style="margin-top:8px"><button class="btn primary" type="button" data-action="next-job" data-i18n="current.next_job">Next job</button></div>
  </div>
  <div class="row"><span data-ref="urgency"></span><span class="muted small" data-ref="schedule"></span></div>
  <div class="muted small" style="margin-top:4px" data-ref="last"><span data-i18n="current.last">Last:</span> <span data-ref="last-outcome"></span> <span data-ref="last-text"></span><div class="pre" data-field="last_note"></div></div>
  <div style="margin:14px 0 8px">
    <button class="btn primary wide" type="button" data-action="open" data-i18n="current.open">Open the portal (new tab)</button>
  </div>
  <div data-ref="creds"></div>
  <div data-ref="instructions"></div>
  <div data-ref="work">
    <textarea class="note" data-ref="note" placeholder="Note (optional), e.g. what was missing" data-i18n-placeholder="current.note"></textarea>
    <div class="finish">
      <button class="btn ok" type="button" data-action="succeeded" data-i18n="current.succeeded">Succeeded</button>
      <button class="btn bad" type="button" data-action="failed" data-i18n="current.failed">Failed</button>
    </div>
  </div>
  <div class="row small" style="margin-top:14px">
    <a data-ref="edit" data-i18n="current.edit">Edit</a> · <a data-ref="history" data-i18n="current.history">History</a>
    <span class="muted" data-ref="retry"></span>
  </div>
</div></template>

<template id="tpl-instructions"><div class="instructions"></div></template>
<template id="tpl-no-instructions"><p class="muted small" data-i18n="current.no_instructions">No instructions stored.</p></template>
<template id="tpl-creds-none"><p class="muted small" data-i18n="creds.none">No login stored.</p></template>
<template id="tpl-creds-user"><div class="field">
  <span class="k" data-i18n="creds.username">Username</span>
  <span class="v" data-field="value"></span>
  <button class="btn icon small" type="button" data-action="copy" data-i18n="creds.copy">Copy</button>
</div></template>
<template id="tpl-creds-password"><div class="field">
  <span class="k" data-i18n="creds.password">Password</span>
  <span class="v" data-ref="value">••••••••••</span>
  <button class="btn icon small" type="button" data-action="toggle" title="show" data-i18n-title="creds.show_title"><span data-ref="show" data-i18n="creds.show">Show</span><span data-ref="hide" data-i18n="creds.hide" hidden>Hide</span></button>
  <button class="btn icon small" type="button" data-action="copy" data-i18n="creds.copy">Copy</button>
</div></template>

<!-- stage, left side -->
<template id="tpl-overview"><div class="pad">
  <div class="row"><h1 class="grow" data-i18n="overview.title">Download jobs</h1><a class="btn" href="#/logins" data-i18n="overview.logins">Import logins (Firefox CSV)</a><a class="btn primary" href="#/new" data-i18n="overview.new">New job</a></div>
  <table data-ref="table">
    <thead><tr>
      <th data-i18n="overview.col.urgency">Urgency</th><th data-i18n="overview.col.job">Job</th><th data-i18n="overview.col.due">Due</th>
      <th data-i18n="overview.col.interval">Interval</th><th data-i18n="overview.col.last">Last</th>
    </tr></thead>
    <tbody data-ref="rows"></tbody>
  </table>
  <p class="muted" data-ref="empty" data-i18n="overview.empty">Create the first job: entry page, login, schedule, and what to file where.</p>
  <p class="muted small" style="margin-top:20px" data-i18n="overview.hint">The most urgent job is always first on the right; ◀ ▶ pages through. “Open the portal” opens it in a new tab; come back to this tab to close the run.</p>
  <div class="card" style="margin-top:20px" data-ref="extension">
    <h3 data-i18n="extension.title">Browser extension</h3>
    <p class="small" data-i18n="extension.text">The extension for Chrome, Edge and Firefox shows the due jobs in the browser's side panel, next to the portal, also of several services at once.</p>
    <a class="btn" target="_blank" rel="noopener noreferrer" data-ref="extension-link" data-i18n="extension.download">Download the extension</a>
    <div data-ref="ca">
      <p class="small" style="margin-bottom:4px" data-i18n="ca.text">The extension in Chrome and Edge needs this service's certificate authority as a trusted root on the computer, imported once. Compare the fingerprint before importing:</p>
      <div class="secret-once" data-field="ca_fingerprint" translate="no"></div>
      <a class="btn" style="margin-top:8px" data-ref="ca-link" download data-i18n="ca.download">Download the certificate authority</a>
    </div>
  </div>
</div></template>
<template id="tpl-overview-row"><tr class="clickable">
  <td data-ref="urgency"></td>
  <td><strong data-field="title"></strong><div class="muted small" data-field="url"></div></td>
  <td class="small" data-field="due"></td>
  <td class="small" data-ref="interval"></td>
  <td class="small" data-ref="last"></td>
</tr></template>

<template id="tpl-gone"><div class="pad">
  <p data-i18n="gone.text">This job no longer exists.</p>
  <a href="#/" data-i18n="gone.back">To the overview</a>
</div></template>

<template id="tpl-edit"><form class="pad medium" data-action="save">
  <h1><span data-ref="head-new" data-i18n="edit.title_new">New download job</span><span data-ref="head-edit" data-i18n="edit.title_edit">Edit job: <span data-field="title"></span></span></h1>
  <label data-i18n="edit.title">Title</label>
  <input type="text" required maxlength="200" data-ref="title">
  <label data-i18n="edit.url">Entry page (URL)</label>
  <input type="url" required placeholder="https://…" data-ref="entry_url">
  <p class="muted small" style="margin:4px 0 0" data-ref="url-hint" data-i18n="edit.url_hint">A new address makes this a new job for the exchange with other instances; its history stays here.</p>
  <div class="row">
    <div class="grow"><label data-i18n="edit.interval">Every how many weeks?</label><input type="number" min="1" max="520" required data-ref="interval_weeks"></div>
    <div class="grow"><label data-i18n="edit.retry">After a failure, due again in … days</label><input type="number" min="1" max="365" required data-ref="retry_days"></div>
    <div class="grow"><label data-i18n="edit.next_due">Next due date</label><input type="date" required data-ref="next_due"></div>
  </div>
  <h2 data-i18n="edit.login">Login</h2>
  <p class="muted small" data-i18n="edit.login_hint">Kept in plain text on the service: everybody in the circle sees it, and a change applies for everybody at once.</p>
  <label data-i18n="edit.username">Username</label>
  <input type="text" autocomplete="off" spellcheck="false" autocapitalize="off" autocorrect="off" data-ref="username">
  <label data-i18n="edit.password">Password</label>
  <input type="text" autocomplete="off" spellcheck="false" autocapitalize="off" autocorrect="off" data-ref="password">
  <h2 data-i18n="edit.instructions">Instructions: what to file where? (Markdown)</h2>
  <textarea data-ref="instructions_md" placeholder="## What to file?&#10;- Invoice as PDF&#10;&#10;## Where?&#10;- Finance/Utilities/2026/" data-i18n-placeholder="edit.instructions_example"></textarea>
  <div class="row" style="margin-top:16px">
    <button class="btn primary" type="submit" data-ref="save"><span data-ref="save-new" data-i18n="edit.create">Create</span><span data-ref="save-edit" data-i18n="edit.save">Save</span></button>
    <a class="btn" data-ref="cancel" data-i18n="edit.cancel">Cancel</a>
    <span class="grow"></span>
    <button class="btn bad" type="button" data-ref="delete" data-action="delete" data-i18n="edit.delete">Delete</button>
  </div>
</form></template>

<template id="tpl-history"><div class="pad">
  <h1 data-i18n="history.title">History: <span data-field="title"></span></h1>
  <table data-ref="table">
    <thead><tr>
      <th data-i18n="history.col.closed">Closed</th><th data-i18n="history.col.outcome">Outcome</th><th data-i18n="history.col.by">By</th>
      <th data-i18n="history.col.due_before">Was due</th><th data-i18n="history.col.due_after">Due after</th><th data-i18n="history.col.note">Note</th>
    </tr></thead>
    <tbody data-ref="rows"></tbody>
  </table>
  <p class="muted" data-ref="empty" data-i18n="history.empty">No run closed yet.</p>
  <p><a data-ref="back" data-i18n="history.back">Back</a></p>
</div></template>
<template id="tpl-history-row"><tr>
  <td class="small" data-field="closed"></td><td data-ref="outcome"></td><td class="small" data-field="by"></td>
  <td class="small" data-field="before"></td><td class="small" data-field="after"></td><td class="small pre" data-field="note"></td>
</tr></template>

<template id="tpl-devices"><div class="pad">
  <h1 data-i18n="devices.title">My devices</h1>
  <p class="muted small" data-i18n="devices.hint">Every browser and browser extension in which you opened an invitation link has an access of its own. Revoke a lost device here; your other devices stay signed in.</p>
  <table>
    <thead><tr><th data-i18n="devices.col.device">Device</th><th data-i18n="devices.col.seen">Last seen</th><th data-i18n="devices.col.recognition">Identification</th><th></th></tr></thead>
    <tbody data-ref="rows"></tbody>
  </table>
  <div class="card" style="margin-top:20px">
    <h3 data-i18n="devices.extension.title">Add to the browser extension</h3>
    <p class="small" data-i18n="devices.extension.text">Creates a link for your browser extension, valid once within the hour, and opens it in this tab. Then click “+” in the extension.</p>
    <button class="btn primary" type="button" data-action="extension" data-i18n="devices.extension.button">Add to the browser extension</button>
  </div>
</div></template>
<template id="tpl-device-row"><tr>
  <td><span data-field="label"></span> <span data-ref="kind"></span> <span class="chip ok" data-ref="this" data-i18n="devices.this">this device</span> <span class="chip bad" data-ref="revoked" data-i18n="devices.revoked">revoked</span></td>
  <td class="small" data-field="seen"></td>
  <td class="small muted"><span data-field="address"></span><div data-field="agent"></div></td>
  <td><button class="btn small" type="button" data-ref="revoke" data-action="revoke"><span data-ref="sign-out" data-i18n="devices.sign_out">Sign out</span><span data-ref="revoke-other" data-i18n="devices.revoke">Revoke</span></button></td>
</tr></template>

<template id="tpl-all-devices"><div class="pad wide-page">
  <h1 data-i18n="alldevices.title">All devices</h1>
  <p class="muted small" data-i18n="alldevices.hint">Every device of every person, most recently seen first. Revoking one signs out only that device.</p>
  <table>
    <thead><tr><th data-i18n="alldevices.col.person">Person</th><th data-i18n="devices.col.device">Device</th><th data-i18n="devices.col.seen">Last seen</th><th data-i18n="alldevices.col.address">Address</th><th></th></tr></thead>
    <tbody data-ref="rows"></tbody>
  </table>
</div></template>
<template id="tpl-all-device-row"><tr>
  <td data-field="person"></td>
  <td><span data-field="label"></span> <span data-ref="kind"></span> <span class="chip bad" data-ref="revoked" data-i18n="devices.revoked">revoked</span></td>
  <td class="small" data-field="seen"></td>
  <td class="small muted" data-field="address"></td>
  <td><button class="btn small" type="button" data-ref="revoke" data-action="revoke" data-i18n="devices.revoke">Revoke</button></td>
</tr></template>

<template id="tpl-invitation-dialog"><div>
  <h1 data-i18n="invitation.dialog.title">Invitation for <span data-field="name"></span></h1>
  <p class="small" data-i18n="invitation.dialog.text">This link is shown only now. It is valid until <span data-field="expires"></span> and can be opened in each of the person's browsers and browser extensions. Pass it on through a confidential channel.</p>
  <div class="secret-once" data-field="link"></div>
  <div class="row" style="margin-top:14px">
    <button class="btn primary" type="button" data-action="copy" data-i18n="invitation.dialog.copy">Copy link</button>
    <button class="btn" type="button" data-action="done" data-i18n="dialog.done">Done</button>
  </div>
</div></template>

<template id="tpl-token-dialog"><div>
  <h1 data-i18n="token.dialog.title">Token <span data-field="display"></span></h1>
  <p class="small" data-ref="backup" data-i18n="token.dialog.backup">This line fetches the backup as a ZIP file. It holds the token and is shown only now. Enter it, for example, as a nightly cron job on the machine that keeps the backups; with the header X-Backup-Password the file is encrypted.</p>
  <p class="small" data-ref="env" data-i18n="token.dialog.env">The token is shown only now. Put it on the machine that uses it into the environment variable PORTAL_DOWNLOAD_AGENT_TOKEN.</p>
  <div class="secret-once" data-field="line"></div>
  <div class="row" style="margin-top:14px">
    <button class="btn primary" type="button" data-action="copy" data-i18n="token.dialog.copy">Copy line</button>
    <button class="btn" type="button" data-action="done" data-i18n="dialog.done">Done</button>
  </div>
</div></template>

<template id="tpl-backup-line-dialog"><div>
  <h1 data-i18n="backupline.title"><span data-field="display"></span> may take the backup</h1>
  <p class="small" data-i18n="backupline.text">With this line the agent fetches the backup; it keeps the token in the environment variable PORTAL_DOWNLOAD_AGENT_TOKEN.</p>
  <div class="secret-once" data-field="line"></div>
  <div class="row" style="margin-top:14px">
    <button class="btn primary" type="button" data-action="copy" data-i18n="token.dialog.copy">Copy line</button>
    <button class="btn" type="button" data-action="done" data-i18n="dialog.done">Done</button>
  </div>
</div></template>

<template id="tpl-forbidden"><div class="pad"><p data-i18n="forbidden.text">This needs a right you do not hold. Ask a person who holds it.</p></div></template>

<template id="tpl-rights"><span>
  <label class="check" style="display:inline-block;margin-right:12px"><input type="checkbox" data-ref="people"><span data-i18n="rights.people">manage people</span></label>
  <label class="check" style="display:inline-block;margin-right:12px"><input type="checkbox" data-ref="agents"><span data-i18n="rights.agents">manage agents</span></label>
  <label class="check" style="display:inline-block"><input type="checkbox" data-ref="backup"><span data-i18n="rights.backup">manage the backup</span></label>
</span></template>

<template id="tpl-people"><div class="pad wide-page">
  <h1 data-i18n="people.title">People</h1>
  <form class="card" data-ref="invite" data-action="invite">
    <h3 data-i18n="people.invite.title">Invite a person</h3>
    <div class="row">
      <div class="grow"><label data-i18n="people.invite.name">Name</label><input type="text" required data-ref="name"></div>
      <div class="grow"><label data-i18n="people.invite.email">E-mail (optional)</label><input type="email" data-ref="email"></div>
    </div>
    <p class="muted small" style="margin:10px 0 0" data-i18n="people.invite.rights">Every person works on all jobs. Besides that, the person may:</p>
    <div data-ref="new-rights"></div>
    <div style="margin-top:10px"><button class="btn primary" type="submit" data-i18n="people.invite.submit">Create invitation</button></div>
  </form>
  <div data-ref="list"></div>
</div></template>

<template id="tpl-person"><div class="card">
  <div class="row">
    <h3 class="grow"><span data-field="name"></span> <span class="chip bad" data-ref="inactive" data-i18n="person.inactive">deactivated</span></h3>
    <span class="muted small" data-field="email"></span>
  </div>
  <p class="muted small" style="margin:4px 0 0" data-field="meta"></p>
  <div class="row small" style="margin-top:8px"><div data-ref="rights"></div><button class="btn small" type="button" data-action="rights" data-i18n="person.rights_save">Set rights</button></div>
  <div class="row small" style="margin-top:8px">
    <button class="btn small" type="button" data-action="reinvite" data-i18n="person.reinvite">New invitation</button>
    <button class="btn small" type="button" data-action="active"><span data-ref="deactivate" data-i18n="person.deactivate">Deactivate</span><span data-ref="reactivate" data-i18n="person.reactivate">Reactivate</span></button>
    <button class="btn small bad" type="button" data-action="delete" data-ref="delete" data-i18n="person.delete">Delete</button>
  </div>
  <table class="small" style="margin-top:8px"><tbody data-ref="rows"></tbody></table>
</div></template>
<template id="tpl-person-device"><tr>
  <td data-i18n="person.device">Device</td>
  <td><span data-field="label"></span> <span data-ref="kind"></span> <span class="chip bad" data-ref="revoked" data-i18n="devices.revoked">revoked</span></td>
  <td class="muted" data-i18n="person.device.meta">last seen <span data-field="seen"></span> · <span data-field="address"></span></td>
  <td><button class="btn small" type="button" data-ref="revoke" data-action="revoke" data-i18n="devices.revoke">Revoke</button></td>
</tr></template>
<template id="tpl-person-invitation"><tr>
  <td data-i18n="person.invitation">Invitation</td>
  <td><span data-i18n="person.invitation.number">No. <span data-field="id"></span></span> <span data-ref="state"></span></td>
  <td class="muted" data-i18n="person.invitation.meta">created <span data-field="created"></span> by <span data-field="by"></span> · valid until <span data-field="expires"></span></td>
  <td><button class="btn small" type="button" data-ref="withdraw" data-action="withdraw" data-i18n="person.invitation.withdraw">Withdraw</button></td>
</tr></template>

<template id="tpl-agents"><div class="pad wide-page">
  <h1 data-i18n="agents.title">Agents</h1>
  <p class="muted small" data-i18n="agents.hint">Agents register themselves and tell you a display string of eight letters. Give each registration exactly one role, and only the display string you were told. Portal logins reach agents only with “Work through jobs” or “Everything on jobs”, or as part of the backup.</p>
  <form class="card" data-action="create-token">
    <h3 data-i18n="agents.create.title">Create a token</h3>
    <p class="muted small" style="margin-top:0" data-i18n="agents.create.hint">For a script that cannot register itself, for example the nightly backup.</p>
    <div class="row">
      <div class="grow"><label data-i18n="agents.create.purpose">What for</label><input type="text" data-ref="purpose" placeholder="e.g. NAS: nightly backup" data-i18n-placeholder="agents.create.purpose_example"></div>
      <div><label data-i18n="agents.create.role">Role</label><select data-ref="new-role"></select></div>
    </div>
    <div style="margin-top:10px"><button class="btn primary" type="submit" data-i18n="agents.create.submit">Create token</button></div>
  </form>
  <div data-ref="live"></div>
  <p class="muted small" data-ref="none" data-i18n="agents.none">No active agents.</p>
  <details data-ref="done"><summary class="small muted" data-ref="done-summary"></summary><div data-ref="done-list"></div></details>
</div></template>

<template id="tpl-agent"><div class="card">
  <div class="row">
    <h3 class="grow"><code data-field="display" translate="no"></code> <span data-ref="state"></span> <span class="chip" data-ref="role"></span></h3>
    <span class="muted small" data-ref="expires"></span>
  </div>
  <p class="small" style="margin:6px 0 0" data-field="introduction"></p>
  <p class="muted small" style="margin:4px 0 0" data-ref="meta"></p>
  <div class="row small" style="margin-top:8px" data-ref="pending">
    <select data-ref="pick"></select>
    <button class="btn small primary" type="button" data-action="grant" data-i18n="agent.grant">Grant</button>
    <button class="btn small" type="button" data-action="reject" data-i18n="agent.reject">Reject</button>
  </div>
  <div class="row small" style="margin-top:8px" data-ref="granted">
    <button class="btn small" type="button" data-action="revoke" data-i18n="devices.revoke">Revoke</button>
  </div>
</div></template>

<template id="tpl-exchange"><div class="pad wide-page">
  <h1 data-i18n="exchange.title">Exchange and backup</h1>
  <div class="card">
    <h3 data-i18n="exchange.export.title">Export the jobs</h3>

<script>
"use strict";
/* Portal-Download – the whole application. The markup above holds every building block as a
   <template> in English; this script clones the blocks, fills values with textContent only,
   shows or hides their parts and binds their actions. Another language replaces the texts of
   the blocks once from i18n/<code>.json. Every piece of content arrives through the API.
   Vendored libraries: none. */

// ------------------------------------------------------------------ building blocks
const $ = (s) => document.querySelector(s);
function T(id) { return document.getElementById(id).content.firstElementChild.cloneNode(true); }
function ref(root, name) { return root.dataset.ref === name ? root : root.querySelector(`[data-ref="${name}"]`); }
function put(root, values) {
  const els = root.dataset.field !== undefined ? [root, ...root.querySelectorAll("[data-field]")] : root.querySelectorAll("[data-field]");
  for (const el of els) if (el.dataset.field in values) el.textContent = values[el.dataset.field] == null ? "" : String(values[el.dataset.field]);
  return root;
}
function bind(root, actions) {
  for (const el of [root, ...root.querySelectorAll("[data-action]")]) {
    const fn = el.dataset.action && actions[el.dataset.action];
    if (!fn) continue;
    if (el.tagName === "FORM") el.addEventListener("submit", (ev) => { ev.preventDefault(); fn(ev); });
    else el.addEventListener(el.tagName === "SELECT" ? "change" : "click", fn);
  }
  return root;
}
const show = (el, on) => { el.hidden = !on; return el; };

// ------------------------------------------------------------------ languages
const LANG_KEY = "portal-download.lang";
const I18N = { code: "en", dict: {}, locale: "en" };
const ORIGINAL = new WeakMap();
const MSG = {};
function original(el) {
  let o = ORIGINAL.get(el);
  if (!o) {
    const fields = new Map();
    let pattern = "";
    for (const n of el.childNodes) {
      if (n.nodeType === Node.ELEMENT_NODE && n.dataset.field !== undefined) { fields.set(n.dataset.field, n); pattern += `{${n.dataset.field}}`; }
      else pattern += n.textContent;
    }
    o = { pattern: pattern.replace(/\s+/g, " ").trim(), fields, attrs: {} };
    for (const a of ["placeholder", "title", "aria-label"]) if (el.hasAttribute(`data-i18n-${a}`)) o.attrs[a] = el.getAttribute(a) || "";
    ORIGINAL.set(el, o);
  }
  return o;
}
function translate(root) {
  for (const el of root.querySelectorAll("[data-i18n],[data-i18n-placeholder],[data-i18n-title],[data-i18n-aria-label]")) {
    if (el.closest("#view, #bar, #modal-box, #toast")) continue; // rendered parts are rendered anew instead
    const o = original(el);
    if (el.dataset.i18n) {
      const pattern = I18N.dict[el.dataset.i18n] ?? o.pattern;
      const nodes = [];
      pattern.split(/\{(\w+)\}/).forEach((s, i) => {
        if (i % 2) { const f = o.fields.get(s); if (f) nodes.push(f); }
        else if (s) nodes.push(document.createTextNode(s));
      });
      el.replaceChildren(...nodes);
    }
    for (const [a, v] of Object.entries(o.attrs)) el.setAttribute(a, I18N.dict[el.getAttribute(`data-i18n-${a}`)] ?? v);
  }
}
function translateAll() {
  translate(document.body);
  for (const t of document.querySelectorAll("template")) translate(t.content);
  for (const k of Object.keys(MSG)) delete MSG[k];
  for (const el of document.getElementById("messages").content.querySelectorAll("[data-msg]")) MSG[el.dataset.msg] = el;
  document.documentElement.lang = I18N.code;
}
function msgNode(key, values = {}) {
  const el = MSG[key].cloneNode(true);
  el.removeAttribute("data-msg");
  return put(el, values);
}
const msg = (key, values) => msgNode(key, values).textContent;
const plural = (key, n, values = {}) => msgNode(`${key}.${n === 1 ? "one" : "other"}`, { n, ...values });
function chosenLanguage() {
  const codes = CONFIG.languages.map((l) => l.code);
  let saved = null;
  try { saved = localStorage.getItem(LANG_KEY); } catch {}
  if (saved && codes.includes(saved)) return saved;
  for (const l of navigator.languages || [navigator.language || ""]) {
    const c = l.toLowerCase().split("-")[0];
    if (codes.includes(c)) return c;
  }
  return codes.includes("en") ? "en" : codes[0] || "en";
}
async function setLanguage(code) {
  let dict = {};
  if (code !== "en") {
    try { dict = await (await fetch(`i18n/${code}.json`, { cache: "no-cache" })).json(); }
    catch (e) { console.error(e); code = "en"; try { localStorage.removeItem(LANG_KEY); } catch {} }
  }
  I18N.code = code; I18N.dict = dict;
  I18N.locale = (navigator.languages || []).find((l) => l.toLowerCase().split("-")[0] === code) || code;
  translateAll();
}
async function switchLanguage(code) {
  if (state.dirty && !(await ask(msg("confirm.lang.discard")))) { renderBar(!!state.me); return; }
  try { localStorage.setItem(LANG_KEY, code); } catch {}
  await setLanguage(code);
  render();
}
function fillLanguages(select) {
  for (const l of CONFIG.languages) {
    const o = T("tpl-option");
    o.value = l.code; o.textContent = l.label; o.selected = l.code === I18N.code;
    select.append(o);
  }
  show(select, CONFIG.languages.length > 1);
}

// ------------------------------------------------------------------ small helpers
function toast(text, isError) {
  const d = T("tpl-toast");
  d.textContent = text;
  if (isError) d.className = "err";
  $("#toast").append(d);
  setTimeout(() => d.remove(), isError ? 9000 : 4500);
}
function fail(e) { console.error(e); toast(e.message || String(e), true); }
const fmtDate = (iso) => { if (!iso) return "–"; const d = new Date(iso.length === 10 ? iso + "T00:00:00" : iso); return d.toLocaleDateString(I18N.locale, { day: "2-digit", month: "2-digit", year: "numeric" }); };
const fmtDateTime = (iso) => iso ? new Date(iso).toLocaleString(I18N.locale, { dateStyle: "short", timeStyle: "short" }) : "–";
function urgency(days) {
  if (days < 0) return plural("urgency.overdue", -days);
  if (days === 0) return msgNode("urgency.today");
  if (days === 1) return msgNode("urgency.tomorrow");
  return msgNode("urgency.in", { n: days });
}
const outcomeChip = (o) => msgNode(o === "succeeded" ? "outcome.succeeded" : "outcome.failed");
const roleName = (r) => MSG[`role.${r}`] ? msg(`role.${r}`) : r;
/** A chip for a state the API names; an unknown state shows as it came. */
const stateChip = (prefix, state) => MSG[`${prefix}.${state}`] ? msgNode(`${prefix}.${state}`) : put(T("tpl-chip"), { text: state });
const rightsText = (r) => ["people", "agents", "backup"].filter((k) => r[k]).map((k) => msg(`right.${k}`)).join(", ") || msg("right.none");
function guessDeviceLabel() {
  const ua = navigator.userAgent;
  const b = /Edg\//.test(ua) ? "Edge" : /Firefox\//.test(ua) ? "Firefox" : /Chrome\//.test(ua) ? "Chrome" : /Safari\//.test(ua) ? "Safari" : "Browser";
  const o = /Windows/.test(ua) ? "Windows" : /Android/.test(ua) ? "Android" : /iPhone|iPad/.test(ua) ? "iOS" : /Mac OS/.test(ua) ? "macOS" : /Linux/.test(ua) ? "Linux" : "";
  return o ? msg("device.guess", { browser: b, os: o }) : b;
}
async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); }
  catch { const t = T("tpl-copy-area"); t.value = text; document.body.append(t); t.select(); document.execCommand("copy"); t.remove(); }
  if (btn) { const old = [...btn.childNodes]; btn.textContent = msg("copy.done"); setTimeout(() => btn.replaceChildren(...old), 1500); }
}
/** Offers bytes as a file to save. */
function saveFile(blob, name) {
  const a = T("tpl-download");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
function bytesOfBase64(b64) { const s = atob(b64); const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; }
async function base64OfFile(file) {
  const b = new Uint8Array(await file.arrayBuffer());
  let s = "";
  for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode(...b.subarray(i, i + 0x8000));
  return btoa(s);
}
/** The password for a file from a text field: empty means none, a short one is refused. */
function filePassword(input) {
  const pw = input.value;
  // It travels in an HTTP header, which carries visible ASCII only.
  if (pw && (pw.length < 8 || pw.length > 200 || !/^[\x20-\x7e]+$/.test(pw) || pw.trim() !== pw)) { toast(msg("toast.password_short"), true); return null; }
  return pw;
}
const pwHeader = (pw) => pw ? { "X-Backup-Password": pw } : {};
const kindChip = (kind) => stateChip("device.kind", kind);

// ------------------------------------------------------------------ dialogs
let pendingAnswer = null; // the resolver of an open question, answered "no" if another dialog replaces it
function openModal(node) {
  if (pendingAnswer) { const answer = pendingAnswer; pendingAnswer = null; answer(false); }
  $("#modal-box").replaceChildren(node);
  $("#modal").hidden = false;
  // Everything behind the dialog is out of reach, as it was behind confirm().
  $("#app").inert = true; $("#toast").inert = true;
  const first = node.querySelector("input"); if (first) first.focus();
}
function closeModal() {
  $("#modal").hidden = true; $("#modal-box").replaceChildren();
  $("#app").inert = false; $("#toast").inert = false;
}
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("#modal").hidden) { const no = $('#modal-box [data-action="no"], #modal-box [data-action="later"], #modal-box [data-action="done"]'); if (no) no.click(); }
});
/** The page's own question in place of confirm(): resolves to true or false. */
function ask(text) {
  return new Promise((resolve) => {
    const d = put(T("tpl-confirm"), { text });
    openModal(d);
    pendingAnswer = resolve;
    const answer = (v) => () => { pendingAnswer = null; closeModal(); resolve(v); };
    bind(d, { yes: answer(true), no: answer(false) });
    d.querySelector('[data-action="yes"]').focus();
  });
}
function lineDialog(id, values, line, showRefs = {}) {
  const d = put(T(id), { ...values, line });
  for (const [r, on] of Object.entries(showRefs)) show(ref(d, r), on);
  bind(d, { copy: (e) => copy(line, e.currentTarget), done: () => { closeModal(); render(); } });
  openModal(d);
}

// ------------------------------------------------------------------ API
let CONFIG = { app_name: "Portal-Download", api: "api/", languages: [{ code: "en", label: "English" }], extension_url: "" };
let seq = 0;
async function rpc(method, params = {}, headers = {}) {
  const res = await fetch(CONFIG.api, {
    method: "POST", credentials: "same-origin",
    headers: { "Content-Type": "application/json", ...headers },
    body: JSON.stringify({ jsonrpc: "2.0", method, params, id: ++seq }),
  });
  let body;
  try { body = await res.json(); } catch { throw new Error(msg("app.unreadable", { status: res.status })); }
  if (body.error) { const e = new Error(body.error.message); e.code = body.error.code; e.type = body.error.data && body.error.data.type; throw e; }
  return body.result;
}

// ------------------------------------------------------------------ state & routing
const state = { status: null, me: null, jobs: [], today: null, current: 0, done: null, logins: null, authError: null, dirty: false, preview: null };
// Something typed into the view and not yet sent; rendering a view starts clean. Ticks and
// weeks of a login export live in state.logins and survive a new rendering, so they are not.
$("#view").addEventListener("input", () => { if (!state.logins) state.dirty = true; });
const can = (right) => !!(state.me && state.me.rights && state.me.rights[right]);
const canAll = () => can("people") && can("agents") && can("backup");
/** Whether the caller holds every right of that person, which acting on them needs. */
const reaches = (rights) => ["people", "agents", "backup"].every((k) => !rights[k] || can(k));

function route() {
  const f = location.hash.replace(/^#/, "");
  if (f.startsWith("invite=")) {
    let token = "";
    try { token = decodeURIComponent(f.slice(7)); } catch {}
    return { view: "invite", token };
  }
  const parts = f.replace(/^\//, "").split("/").filter(Boolean);
  const id = parts[1] ? Number(parts[1]) : null;
  if (parts[1] && !Number.isInteger(id)) return { view: "work", id: null };
  return { view: parts[0] || "work", id };
}
function go(fragment) { if (location.hash !== fragment) location.hash = fragment; else render(); }
window.addEventListener("hashchange", () => render());

async function loadJobs() {
  const r = await rpc("job.list");
  state.jobs = r.jobs; state.today = r.today;
  if (state.current >= state.jobs.length) state.current = Math.max(0, state.jobs.length - 1);
}
const currentJob = () => state.jobs[state.current] || null;
function selectJob(id) {
  const i = state.jobs.findIndex((j) => j.job_id === id);
  if (i >= 0) state.current = i;
}

/** Runs at most n of the given tasks at once; each promise settles with the task's result, or null when it fails. */
function limit(n) {
  let active = 0;
  const queue = [];
  const next = () => {
    if (active >= n || !queue.length) return;
    const [task, settle] = queue.shift();
    active++;
    task().then(settle, () => settle(null)).finally(() => { active--; next(); });
  };
  const run = (task) => new Promise((settle) => { queue.push([task, settle]); next(); });
  // Settles what is still waiting with null, without running it.
  run.clear = () => { for (const [, settle] of queue.splice(0)) settle(null); };
  return run;
}

// ------------------------------------------------------------------ portal in a tab
function openPortalWindow(url) {
  // A normal tab with the browser's own navigation, not a pop-up without it.
  const win = window.open("", "_blank");
  if (!win) { toast(msg("toast.popup_blocked"), true); return; }
  // The new tab is still about:blank and ours: cut the way back before loading the portal.
  try { win.opener = null; } catch {}
  try { win.location.href = url; } catch { toast(msg("toast.popup_redirect"), true); return; }
}

/** The work bar; without access (setup, invitation, no access) only its head with the language choice. */
function renderBar(withAccess = true) {

function renderCurrent(job) {
  const n = state.jobs.length;
  const d = put(T("tpl-current"), { pos: state.current + 1, n, title: job.title });
  d.querySelector('[data-action="prev"]').disabled = state.current === 0;
  d.querySelector('[data-action="next"]').disabled = state.current >= n - 1;
  // After a run is closed the job stays in sight with its new date, until "next job".
  const done = state.done && state.done.job_id === job.job_id ? state.done : null;
  show(ref(d, "done"), !!done);
  show(ref(d, "work"), !done);
  if (done) put(ref(d, "done"), { next_due: fmtDate(done.next_due) });
  ref(d, "urgency").replaceWith(urgency(job.urgency_days));
  ref(d, "schedule").textContent = plural("schedule", job.interval_weeks, { date: fmtDate(job.next_due) }).textContent;
  const last = job.last_run;
  show(ref(d, "last"), !!last);
  if (last) {
    ref(d, "last-outcome").replaceWith(outcomeChip(last.outcome));
    ref(d, "last-text").textContent = msg("last.by", { when: fmtDateTime(last.finished_at), by: last.by });
    put(ref(d, "last"), { last_note: last.note });
  }
  fillCreds(job, ref(d, "creds"));
  ref(d, "instructions").replaceWith(job.instructions_html ? instructionsBlock(job.instructions_html) : T("tpl-no-instructions"));
  ref(d, "edit").href = `#/edit/${job.job_id}`;
  ref(d, "history").href = `#/history/${job.job_id}`;
  ref(d, "retry").textContent = plural("retry", job.retry_days).textContent;
  const note = ref(d, "note");
  const finish = async (outcome) => {
    if (!(await ask(msg(`confirm.finish.${outcome}`, { title: job.title })))) return;
    try {
      const r = await rpc("job.complete", { job_id: job.job_id, outcome, note: note.value, expected_next_due: job.next_due });
      state.done = { job_id: job.job_id, next_due: r.next_due };
      await loadJobs(); selectJob(job.job_id);
      go(`#/job/${job.job_id}`);
    } catch (e) {
      fail(e);
      if (e.type === "job_changed") { await loadJobs(); render(); }
    }
  };
  return bind(d, {
    prev: () => { state.done = null; state.current--; go(`#/job/${currentJob().job_id}`); },
    next: () => { state.done = null; state.current++; go(`#/job/${currentJob().job_id}`); },
    "next-job": () => { state.done = null; state.current = 0; go(state.jobs.length ? `#/job/${state.jobs[0].job_id}` : "#/"); },
    open: () => openPortalWindow(job.entry_url),
    succeeded: () => finish("succeeded"),
    failed: () => finish("failed"),
  });
}

function instructionsBlock(html) {
  const d = T("tpl-instructions");
  d.innerHTML = html; // the only HTML put into the page: Markdown the service rendered and sanitized
  for (const a of d.querySelectorAll("a[href]")) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
  return d;
}

function fillCreds(job, box) {
  const c = { username: job.username || "", password: job.password || "" };
  if (!c.username && !c.password) { box.replaceChildren(T("tpl-creds-none")); return; }
  const rows = [];
  if (c.username) {
    const r = put(T("tpl-creds-user"), { value: c.username });
    r.querySelector('[data-field="value"]').title = c.username;
    rows.push(bind(r, { copy: (e) => copy(c.username, e.currentTarget) }));
  }
  if (c.password) {
    const r = T("tpl-creds-password");
    const v = ref(r, "value"), masked = v.textContent;
    let shown = false;
    rows.push(bind(r, {
      toggle: () => { shown = !shown; v.textContent = shown ? c.password : masked; show(ref(r, "show"), !shown); show(ref(r, "hide"), shown); },
      copy: (e) => copy(c.password, e.currentTarget),
    }));
  }
  box.replaceChildren(...rows);
}

async function viewEdit(id) {
  const job = id ? state.jobs.find((j) => j.job_id === id) : null;
  if (id && !job) return T("tpl-gone");
  const d = put(T("tpl-edit"), { title: job ? job.title : "" });
  const f = (name) => ref(d, name);
  show(f("head-new"), !job); show(f("head-edit"), !!job);
  show(f("save-new"), !job); show(f("save-edit"), !!job);
  show(f("delete"), !!job); show(f("url-hint"), !!job);
  f("title").value = job ? job.title : "";
  f("entry_url").value = job ? job.entry_url : "";
  f("interval_weeks").value = job ? job.interval_weeks : 4;
  f("retry_days").value = job ? job.retry_days : 2;
  f("next_due").value = job ? job.next_due : state.today;
  f("instructions_md").value = job ? job.instructions_md : "";
  f("username").value = job ? job.username || "" : "";
  f("password").value = job ? job.password || "" : "";
  f("cancel").href = job ? `#/job/${job.job_id}` : "#/";
  const save = f("save");
  return bind(d, {
    delete: async () => {
      if (!(await ask(msg("confirm.job.delete", { title: job.title })))) return;
      try { await rpc("job.delete", { job_id: job.job_id }); await loadJobs(); toast(msg("toast.deleted")); go("#/"); } catch (e) { fail(e); }
    },
    save: async () => {
      save.disabled = true;
      try {
        const all = {
          title: f("title").value, entry_url: f("entry_url").value.trim(),
          interval_weeks: Number(f("interval_weeks").value), retry_days: Number(f("retry_days").value), next_due: f("next_due").value,
          instructions_md: f("instructions_md").value, username: f("username").value, password: f("password").value,
        };
        // When editing, send only what was changed, so that a concurrent change by somebody else survives.
        const p = {};
        for (const [k, v] of Object.entries(all)) if (!job || job[k] !== v) p[k] = v;
        const r = job ? await rpc("job.update", { job_id: job.job_id, ...p }) : await rpc("job.create", p);
        await loadJobs(); selectJob(r.job_id);
        toast(msg(job ? "toast.saved" : "toast.created"));
        go(`#/job/${r.job_id}`);
      } catch (e) { save.disabled = false; fail(e); }
    },
  });
}

async function viewHistory(id) {

/** Three tick boxes for the rights; only rights the caller holds can be changed. */

async function viewPeople() {
  if (!can("people")) return T("tpl-forbidden");
  const r = await rpc("user.list");
  const d = T("tpl-people");
  const act = (question, fn) => async () => { if (question && !(await ask(question))) return; try { await fn(); render(); } catch (e) { fail(e); } };
  const invite = ref(d, "invite");
  const newRights = rightsBox({});
  ref(d, "new-rights").append(newRights.box);
  for (const u of r.users) {
    const card = put(T("tpl-person"), { name: u.name, email: u.email, meta: [rightsText(u.rights), u.created_by ? msg("person.created_by", { name: u.created_by }) : ""].filter(Boolean).join(" · ") });
    show(ref(card, "inactive"), !u.active);
    show(ref(card, "deactivate"), u.active); show(ref(card, "reactivate"), !u.active);
    // What acts on a person needs every right that person holds.
    const within = reaches(u.rights);
    show(ref(card, "delete"), within && u.user_id !== state.me.user_id);
    // Deactivating oneself would lock one out at the next request.
    show(card.querySelector('[data-action="active"]'), u.user_id !== state.me.user_id);
    for (const r of ["reinvite", "active", "rights"]) card.querySelectorAll(`[data-action="${r}"]`).forEach((b) => (b.disabled = !within));
    if (!within) for (const c of ref(card, "rights").querySelectorAll("input")) c.disabled = true;
    const rights = rightsBox(u.rights);
    ref(card, "rights").append(rights.box);
    bind(card, {
      reinvite: async () => { try { showInvitation(u.name, await rpc("user.reinvite", { user_id: u.user_id })); } catch (e) { fail(e); } },
      rights: async () => {
        const v = rights.value();
        if (!(await ask(msg("confirm.person.rights", { name: u.name, rights: rightsText(v) })))) return;
        try { await rpc("user.setRights", { user_id: u.user_id, rights: v }); render(); } catch (e) { fail(e); render(); }
      },
      active: act(u.active ? msg("confirm.person.deactivate", { name: u.name }) : null, () => rpc("user.setActive", { user_id: u.user_id, active: !u.active })),
      delete: act(msg("confirm.person.delete", { name: u.name }), () => rpc("user.delete", { user_id: u.user_id })),
    });
    for (const dev of u.devices) {
      const tr = put(T("tpl-person-device"), { label: dev.label, seen: fmtDateTime(dev.last_seen_at), address: dev.last_address });
      ref(tr, "kind").append(kindChip(dev.kind));
      show(ref(tr, "revoked"), !!dev.revoked_at); show(ref(tr, "revoke"), !dev.revoked_at && within);
      bind(tr, { revoke: act(msg("confirm.person.device", { label: dev.label, name: u.name }), () => rpc("device.revoke", { device_id: dev.device_id })) });
      ref(card, "rows").append(tr);
    }
    for (const i of u.invitations) {
      const tr = put(T("tpl-person-invitation"), { id: i.invitation_id, created: fmtDateTime(i.created_at), by: i.created_by, expires: fmtDateTime(i.expires_at) });
      ref(tr, "state").append(stateChip("invitation.state", i.state));
      show(ref(tr, "withdraw"), i.state === "open" && within);
      bind(tr, { withdraw: act(msg("confirm.invitation.withdraw"), () => rpc("invitation.withdraw", { invitation_id: i.invitation_id })) });
      ref(card, "rows").append(tr);
    }
    ref(d, "list").append(card);
  }

const roleWarning = (role) => role === "people.manage" ? "\n\n" + msg("confirm.agent.grant_people") : role === "agents.manage" ? "\n\n" + msg("confirm.agent.grant_agents") : "";

async function viewAgents() {
  if (!can("agents")) return T("tpl-forbidden");
  const ag = await rpc("agent.list");
  const people = can("people") ? (await rpc("user.list")).users : [];
  const d = T("tpl-agents");
  const act = (question, fn) => async () => { if (question && !(await ask(question))) return; try { await fn(); render(); } catch (e) { fail(e); } };
  const options = (select, selected) => {
    for (const x of ag.roles.filter((x) => x.grantable)) {
      const o = T("tpl-option");
      o.value = x.role; o.textContent = roleName(x.role); o.title = x.permits; o.selected = x.role === selected;
      select.append(o);
    }
  };
  const agentCard = (a) => {
    const card = put(T("tpl-agent"), { display: a.display, introduction: a.introduction });
    ref(card, "state").append(stateChip("agent.state", a.state));
    const role = ref(card, "role");
    if (a.role) role.textContent = roleName(a.role); else show(role, false);
    const active = a.state === "pending" || a.state === "granted";
    ref(card, "expires").textContent = active ? msg("agent.expires", { date: fmtDateTime(a.expires_at) }) : "";
    const meta = [msg("agent.registered", { date: fmtDateTime(a.created_at) })];
    if (a.granted_by) meta.push(msg("agent.granted_by", { name: a.granted_by }));
    meta.push(a.last_used_at ? msg("agent.last_used", { date: fmtDateTime(a.last_used_at) }) : msg("agent.never_used"));
    // What this token granted or invited stays when it is revoked; it is named here to revoke one by one.
    const by = (x) => typeof x === "string" && (x === `Agent ${a.display}` || x.startsWith(`Agent ${a.display} `));
    const tokens = ag.agents.filter((x) => by(x.granted_by)).length, invited = people.filter((u) => by(u.created_by)).length;
    if (tokens || invited) meta.push(msg("agent.created", { tokens, people: invited }));
    ref(card, "meta").textContent = meta.join(" ");
    show(ref(card, "pending"), a.state === "pending");
    show(ref(card, "granted"), a.state === "granted");
    const pick = ref(card, "pick");
    options(pick, null);
    return bind(card, {
      grant: async () => {
        const chosen = pick.value;
        if (!(await ask(msg("confirm.agent.grant", { display: a.display, role: roleName(chosen) }) + roleWarning(chosen)))) return;
        try { await rpc("agent.grant", { agent_id: a.agent_id, role: chosen }); if (chosen === "backup.read") showBackupLine(a.display); else render(); } catch (e) { fail(e); }
      },
      reject: act(msg("confirm.agent.reject", { display: a.display }), () => rpc("agent.revoke", { agent_id: a.agent_id })),
      revoke: act(msg("confirm.agent.revoke", { display: a.display }), () => rpc("agent.revoke", { agent_id: a.agent_id })),
    });
  };
  const live = ag.agents.filter((a) => a.state === "pending" || a.state === "granted");
  const done = ag.agents.filter((a) => !live.includes(a));
  for (const a of live) ref(d, "live").append(agentCard(a));
  show(ref(d, "none"), live.length === 0);
  show(ref(d, "done"), done.length > 0);
  ref(d, "done-summary").textContent = msg("agent.done", { n: done.length });
  for (const a of done) ref(d, "done-list").append(agentCard(a));
  options(ref(d, "new-role"), "backup.read");
  return bind(d, {
    "create-token": async () => {
      const role = ref(d, "new-role").value;
      if (!(await ask(msg("confirm.token.create", { role: roleName(role) }) + roleWarning(role)))) return;
      try { showToken(await rpc("agent.create", { introduction: ref(d, "purpose").value, role })); } catch (e) { fail(e); }
    },
  });
}

// ------------------------------------------------------------------ exchange and backup
function viewExchange() {
  const d = T("tpl-exchange");

  const download = async (input, fetchIt) => {
    const pw = filePassword(input);
    if (pw === null) return;
    if (!pw && !(await ask(msg("confirm.export.plain")))) return;
    try { await fetchIt(pw); } catch (e) { fail(e); }
