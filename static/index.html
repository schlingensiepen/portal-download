  if (P) ref(d, "preview").append(previewCard(P));
  return bind(d, {
    "export-jobs": () => download(ref(d, "export-password"), async (pw) => {
      const r = await rpc("job.export", {}, pwHeader(pw));
      if (r.encrypted !== !!pw) { toast(msg("toast.not_encrypted"), true); return; }
      saveFile(new Blob([bytesOfBase64(r.zip_base64)], { type: "application/zip" }), r.file_name);
    }),
    "export-backup": () => download(ref(d, "backup-password"), async (pw) => {
      const r = await rpc("backup.export", {}, pwHeader(pw));
      if (r.encrypted !== !!pw) { toast(msg("toast.not_encrypted"), true); return; }
      saveFile(new Blob([bytesOfBase64(r.zip_base64)], { type: "application/zip" }), r.file_name);
    }),
    preview: async () => {
      const file = ref(d, "file").files[0];
      if (!file) { toast(msg("toast.choose_file"), true); return; }
      const full = ref(d, "full").checked && canAll();
      const pw = filePassword(ref(d, "import-password"));
      if (pw === null) return;
      try {
        const zip = await base64OfFile(file);
        const result = await rpc(full ? "backup.importPreview" : "job.importPreview", { zip_base64: zip }, pwHeader(pw));
        state.preview = { zip, pw, full, result, choices: {} };
        render();
      } catch (e) { fail(e); }
    },
  });
}

const fieldValue = (field, v) => v === "•••" ? msg("preview.hidden") : field === "next_due" ? fmtDate(v) : String(v);

function previewCard(P) {
  const R = P.result;
  const d = put(T("tpl-preview"), { n_new: R.new.length, n_same: R.same.length, n_decide: R.decide.length });
  show(ref(d, "people"), !!R.people && P.full);
  if (R.people) put(ref(d, "people"), R.people);
  for (const x of R.new) ref(d, "new").append(put(T("tpl-preview-line"), { title: x.title, detail: x.new_runs ? msg("preview.runs", { n: x.new_runs }) : "" }));
  for (const x of R.same) {
    const detail = [x.new_runs ? msg("preview.runs", { n: x.new_runs }) : "", x.next_due_from_run ? msg("preview.due", { date: fmtDate(x.next_due_from_run) }) : ""].filter(Boolean).join(" · ");
    ref(d, "same").append(put(T("tpl-preview-line"), { title: x.title, detail }));
  }
  for (const x of R.decide) {
    const fields = Object.fromEntries((x.fields || []).map((f) => [f.field, f.preselect]));
    const choice = P.choices[x.guid] || (P.choices[x.guid] = x.actions ? (x.fields ? { action: x.preselect, fields } : { action: x.preselect }) : { fields });
    const caseText = x.case === "deleted_here" ? msg("case.deleted_here", { date: fmtDateTime(x.deleted_at) })
      : x.case === "replaces" ? msg("case.replaces", { title: x.replaces_title, url: x.local_entry_url })
      : x.case === "old_address" ? msg("case.old_address", { url: x.local_entry_url }) : msg("case.known");
    const card = put(T("tpl-decide"), { title: x.title, url: x.entry_url, case: caseText });
    const rows = ref(card, "rows");
    show(ref(card, "fields"), !!(x.fields && x.fields.length));
    for (const f of x.fields || []) {
      const tr = put(T("tpl-decide-field"), {
        field: msg(`field.${f.field}`), local: fieldValue(f.field, f.local), incoming: fieldValue(f.field, f.incoming),
        local_at: msg("preview.changed", { date: fmtDateTime(f.local_changed_at) }), incoming_at: msg("preview.changed", { date: fmtDateTime(f.incoming_changed_at) }),
      });
      const name = `${x.guid}:${f.field}`;
      for (const side of ["local", "incoming"]) {
        const radio = ref(tr, side);
        radio.name = name; radio.checked = choice.fields && choice.fields[f.field] === side;
        radio.addEventListener("change", () => { if (radio.checked) choice.fields[f.field] = side; });
      }
      rows.append(tr);
    }
    const select = ref(card, "action");
    show(select, !!x.actions);
    for (const a of x.actions || []) {
      const o = T("tpl-option");
      o.value = a; o.textContent = msg(`action.${a}`); o.selected = a === choice.action;
      select.append(o);
    }
    select.addEventListener("change", () => { choice.action = select.value; });
    ref(d, "decide").append(card);
  }
  return bind(d, {
    cancel: () => { state.preview = null; render(); },
    apply: async () => {
      if (!(await ask(msg("confirm.import")))) return;
      try {
        const r = await rpc(P.full ? "backup.import" : "job.import", { zip_base64: P.zip, decisions: P.choices }, pwHeader(P.pw));
        state.preview = null;
        toast(msg("toast.imported", { added: r.added, updated: r.updated, reactivated: r.reactivated, replaced: r.replaced, skipped: r.skipped, runs: r.runs_added }));
        if (r.people) toast(msg("toast.imported_people", { people: r.people.people, devices: r.people.devices, agents: r.people.agents, renamed: r.people.renamed.join(", ") || "–" }));
        await loadJobs(); go("#/");
      } catch (e) { fail(e); }
    },
  });
}

// ------------------------------------------------------------------ logins from a Firefox export
/** Splits CSV text after RFC 4180 into rows of fields; null when a quoted field is never closed. */
function parseCsv(text) {
  const rows = [];
  let row = [], field = "", quoted = false, closed = false;
  const endField = () => { row.push(field); field = ""; closed = false; };
  for (let i = text.charCodeAt(0) === 0xfeff ? 1 : 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c !== "\"") field += c;
      else if (text[i + 1] === "\"") { field += c; i++; }
      else { quoted = false; closed = true; }
    } else if (c === "\"" && field === "" && !closed) quoted = true;
    else if (c === ",") endField();
    else if (c === "\r" || c === "\n") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      endField();
      if (row.length > 1 || row[0] !== "") rows.push(row);
      row = [];
    } else field += c;
  }
  if (quoted) return null;
  if (field !== "" || closed || row.length) { endField(); rows.push(row); }
  return rows;
}
/** The host name of an address in lower case, or null when it is no http or https address. */
function webHost(url) {
  try { const u = new URL(url); return u.protocol === "https:" || u.protocol === "http:" ? u : null; } catch { return null; }
}
// Duplicate rule: same host name (case-insensitive; scheme, port and path ignored) and the same
// username, exactly as written. It holds within the file and against the entry address of a job.
const loginKey = (hostname, username) => `${hostname.toLowerCase()}\n${username}`;
/** Reads a Firefox export into one entry per host name and username, or names the message why not. */
function readLogins(text) {
  const rows = parseCsv(text);
  if (!rows) return { error: "logins.damaged" };
  const head = (rows[0] || []).map((h) => h.trim().toLowerCase());
  const col = (name) => head.indexOf(name);
  const [iu, in_, ip, it] = [col("url"), col("username"), col("password"), col("timepasswordchanged")];
  if (iu < 0 || in_ < 0 || ip < 0) return { error: "logins.bad_file" };
  const byKey = new Map();
  let n = 0;
  for (const r of rows.slice(1)) {
    const url = (r[iu] || "").trim(), username = r[in_] || "", password = r[ip] || "";
    if (!url) continue;
    n++;
    const u = webHost(url);
    const x = { url, username, password, host: u ? u.host : url, key: u ? loginKey(u.hostname, username) : `\n${url}\n${username}`, web: !!u, changed: Number(r[it]) || 0, picked: false, weeks: 4 };
    // Of two entries for the same login, the one whose password changed last counts.
    const old = byKey.get(x.key);
    if (!old || x.changed >= old.changed) byKey.set(x.key, x);
  }
  const items = [...byKey.values()].sort((a, b) => a.host.localeCompare(b.host) || a.username.localeCompare(b.username));
  return { items, n, dupes: n - items.length };
}
function existingLoginKeys() {
  const keys = new Set();
  for (const j of state.jobs) { const u = webHost(j.entry_url); if (u) keys.add(loginKey(u.hostname, j.username || "")); }
  return keys;
}

function viewLogins() {
  const d = T("tpl-logins");
  const L = state.logins;
  const file = ref(d, "file");
  file.addEventListener("change", async () => {
    const f = file.files[0];
    if (!f) return;
    const read = readLogins(await f.text());
    file.value = "";
    if (read.error) { state.logins = null; toast(msg(read.error), true); render(); return; }
    state.logins = read;
    render();
  });
  show(ref(d, "list"), !!L);
  if (!L) return d;
  const existing = existingLoginKeys();
  const free = (x) => x.web && !existing.has(x.key);
  ref(d, "summary").textContent = msg("logins.summary", { n: L.n, dupes: L.dupes, existing: L.items.filter((x) => existing.has(x.key)).length });
  const shown = [];
  // Counts every ticked login, also one the search hides.
  const count = () => { ref(d, "ticked").textContent = msg("logins.ticked", { n: L.items.filter((x) => x.picked && free(x)).length }); };
  for (const x of L.items) {
    const tr = put(T("tpl-logins-row"), { host: x.host, username: x.username || "–" });
    const pick = ref(tr, "pick"), weeks = ref(tr, "weeks");
    if (!free(x)) x.picked = false;
    pick.checked = x.picked; pick.disabled = !free(x);
    weeks.value = x.weeks; weeks.disabled = !free(x);
    show(ref(tr, "existing"), x.web && existing.has(x.key));
    show(ref(tr, "not-web"), !x.web);
    pick.addEventListener("change", () => { x.picked = pick.checked; count(); });
    weeks.addEventListener("input", () => { x.weeks = Number(weeks.value); weeks.classList.remove("invalid"); });
    shown.push({ x, tr, pick, weeks });
    ref(d, "rows").append(tr);
  }
  const search = ref(d, "search");
  const filter = () => {
    const q = search.value.trim().toLowerCase();
    for (const s of shown) show(s.tr, !q || s.x.host.toLowerCase().includes(q) || s.x.username.toLowerCase().includes(q));
  };
  search.addEventListener("input", filter);
  const tickShown = (on) => () => { for (const s of shown) if (!s.tr.hidden && free(s.x)) { s.x.picked = on; s.pick.checked = on; } count(); };
  const create = ref(d, "create");
  count();
  return bind(d, {
    all: tickShown(true),
    none: tickShown(false),
    create: async () => {
      const chosen = L.items.filter((x) => x.picked && free(x));
      if (!chosen.length) { toast(msg("toast.logins.none"), true); return; }
      const bad = shown.filter((s) => chosen.includes(s.x) && !(Number.isInteger(s.x.weeks) && s.x.weeks >= 1 && s.x.weeks <= 520));
      for (const s of bad) s.weeks.classList.add("invalid");
      if (bad.length) {
        // The marked rows must be in sight, also when the search hides them.
        if (bad.some((s) => s.tr.hidden)) { search.value = ""; filter(); }
        toast(msg("toast.logins.weeks"), true);
        return;
      }
      if (!(await ask(plural("confirm.logins", chosen.length).textContent))) return;
      const at = location.hash;
      const list = ref(d, "list"), label = [...create.childNodes];
      create.disabled = true;
      list.inert = true;
      let made = 0, inRow = 0, stop = null;
      const failed = [];
      try {
        for (const x of chosen) {
          create.textContent = msg("logins.progress", { done: made + failed.length, n: chosen.length });
          try {
            await rpc("job.create", { title: x.host, entry_url: x.url, username: x.username, password: x.password, instructions_md: "", interval_weeks: x.weeks });
            made++; inRow = 0; x.picked = false;
          } catch (e) {
            failed.push(msg("logins.failure", { host: x.host, username: x.username || "–", reason: e.message }));
            inRow++;
            // A rejected login (4xx) goes into the summary and the run goes on. Without an error
            // code the service is out of reach and with 401 the access is gone: both stop at once;
            // three errors of the service (5xx) in a row stop too.
            if (e.code && e.code !== 401 && e.code < 500) { inRow = 0; continue; }
            if (!e.code || e.code === 401 || inRow >= 3) { stop = e; break; }
          }
        }
      } finally {
        create.replaceChildren(...label);
        create.disabled = false;
        list.inert = false;
      }
      if (stop && stop.code === 401) { fail(stop); render(); return; }
      const reasons = failed.slice(0, 5).join(" · ") + (failed.length > 5 ? " · …" : "");
      if (stop) toast(msg("toast.logins.stopped", { created: made, failed: failed.length, left: chosen.length - made - failed.length, list: reasons }), true);
      else if (failed.length) toast(msg("toast.logins.summary", { created: made, failed: failed.length, list: reasons }), true);
      else toast(plural("toast.logins.created", made).textContent);
      // Another view opened during the run renders itself.
      if (location.hash === at) render();
    },
  });
}

// ------------------------------------------------------------------ entry states
function viewInvite(token) {
  const d = T("tpl-invite");
  fillExtensionCard(ref(d, "extension"));
  ref(d, "label").value = guessDeviceLabel();
  // A link one has just created for a further device of one's own is meant for the extension and serves once.
  const own = state.ownLink === token;
  show(ref(d, "signed-in"), !!state.me);
  show(ref(d, "own"), own);
  show(ref(d, "here"), !own);
  show(ref(d, "other"), !!state.me && !own);
  const submit = ref(d, "submit");
  return bind(d, {
    accept: async () => {
      submit.disabled = true;
      try {
        const r = await rpc("invitation.redeem", { token, label: ref(d, "label").value, kind: "browser" });
        history.replaceState(null, "", location.pathname + "#/");
        toast(msg("toast.welcome", { name: r.name }));
        await boot();
      } catch (e) { submit.disabled = false; fail(e); }
    },
  });
}

function viewSetup() {
  const d = T("tpl-setup");
  return bind(d, {
    setup: async () => {
      try {
        const r = await rpc("setup.createAdmin", { name: ref(d, "name").value, email: ref(d, "email").value }, { "X-Setup-Secret": ref(d, "secret").value.trim() });
        location.hash = "#invite=" + encodeURIComponent(r.invitation_token);
      } catch (e) { fail(e); }
    },
  });
}

function viewNoAccess(err) {
  const d = put(T("tpl-no-access"), { app_name: CONFIG.app_name, error: err || "" });
  fillExtensionCard(d);
  return d;
}

// ------------------------------------------------------------------ render
let renderSeq = 0;
async function render() {
  const mySeq = ++renderSeq;
  const r = route();
  const view = $("#view");
  if (r.view === "invite") { renderBar(!!state.me); view.replaceChildren(viewInvite(r.token)); state.dirty = false; return; }
  if (!state.me) {
    renderBar(false);
    view.replaceChildren(state.status && state.status.setup_required ? viewSetup() : viewNoAccess(state.authError));
    state.dirty = false;
    return;
  }
  // Others in the circle may have closed or changed jobs, or one's rights: fetch both on every navigation.
  try {
    const st = await rpc("service.status");
    if (mySeq !== renderSeq) return;
    state.status = st;
    if (st.me && st.me.kind === "person") state.me = st.me;
    await loadJobs();
  } catch (e) {
    if (mySeq !== renderSeq) return;
    if (e.code === 401) { state.me = null; state.authError = e.message; return render(); }
    fail(e);
  }
  if (mySeq !== renderSeq) return;
  if (r.id && ["job", "edit", "history"].includes(r.view)) selectJob(r.id);
  // The note that a run was closed belongs to that job's view only.
  if (!(r.view === "job" && state.done && state.done.job_id === r.id)) state.done = null;
  // The logins read from an export, and a file's preview, stay only while their view is shown.
  if (r.view !== "logins") state.logins = null;
  if (r.view !== "exchange") state.preview = null;
  renderBar();
  let content = null;
  try {
    if (r.view === "new") content = await viewEdit(null);
    else if (r.view === "edit") content = await viewEdit(r.id);
    else if (r.view === "history") content = await viewHistory(r.id);
    else if (r.view === "people") content = await viewPeople();
    else if (r.view === "agents") content = await viewAgents();
    else if (r.view === "exchange") content = viewExchange();
    else if (r.view === "logins") content = viewLogins();
    else if (r.view === "devices") content = await viewDevices();
    else if (r.view === "all-devices") content = await viewAllDevices();
    else content = viewOverview();
  } catch (e) {
    if (mySeq !== renderSeq) return;
    if (e.code === 401) { state.me = null; state.authError = e.message; return render(); }
    fail(e); content = viewOverview();
  }
  if (mySeq !== renderSeq) return; // a newer render has started
  view.replaceChildren(...(content ? [content] : []));
  state.dirty = false;
}

async function boot() {
  try {
    state.status = await rpc("service.status");
    state.me = state.status.me && state.status.me.kind === "person" ? state.status.me : null;
    if (state.me) {
      await loadJobs();
    }
  } catch (e) {
    state.authError = e.message;
    fail(e);
  } finally {
    $("#loading").hidden = true;
  }
  await render();
}

async function start() {
  try { CONFIG = { ...CONFIG, ...(await (await fetch("config.json", { cache: "no-cache" })).json()) }; } catch (e) { console.error(e); }
  document.title = CONFIG.app_name;
  await setLanguage(chosenLanguage());
  if (!window.isSecureContext) {
    ref($("#loading"), "text").textContent = msg("app.insecure");
    $("#loading").querySelector(".spinner").hidden = true;
    return;
  }
  await boot();
}
start();
</script>
</body>
</html>
