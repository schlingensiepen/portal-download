<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title>Portal-Download</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5d6677; --line: #dde1e8;
  --accent: #2456c7; --accent-text: #ffffff; --ok: #1d7a46; --bad: #b3261e; --warn: #a15c00;
  --chip-bad: #fde7e6; --chip-warn: #fff1dc; --chip-ok: #e3f4ea; --chip: #eef1f6;
  --radius: 8px; --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171c; --panel: #1c2027; --text: #e6e9ef; --muted: #9aa3b2; --line: #2e343e;
    --accent: #6c9bff; --accent-text: #0d1220; --ok: #5cc98b; --bad: #ff8a80; --warn: #ffb74d;
    --chip-bad: #3a1f1f; --chip-warn: #3a2d17; --chip-ok: #1b3326; --chip: #262b34;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--accent); }
#app { display: grid; grid-template-columns: 1fr minmax(320px, 25%); height: 100vh; }
#stage { position: relative; overflow: auto; border-right: 1px solid var(--line); }
#bar { background: var(--panel); overflow: auto; display: flex; flex-direction: column; }
@media (max-width: 800px) {
  #app { grid-template-columns: 1fr; grid-template-rows: auto auto; height: auto; }
  #bar { order: -1; border-bottom: 1px solid var(--line); }
  #stage { min-height: 70vh; border-right: 0; }
}
.pad { padding: 20px 24px; }
h1 { font-size: 20px; margin: 0 0 12px; }
h2 { font-size: 16px; margin: 20px 0 8px; }
h3 { font-size: 15px; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); padding: 7px 12px; cursor: pointer; text-decoration: none; color: inherit; display: inline-block; }
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.btn.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
.btn.bad { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.link { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; }
.btn.icon { padding: 6px 10px; }
.btn.wide { width: 100%; }
.chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: var(--chip); }
.chip.bad { background: var(--chip-bad); color: var(--bad); }
.chip.warn { background: var(--chip-warn); color: var(--warn); }
.chip.ok { background: var(--chip-ok); color: var(--ok); }
label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
label.check { color: var(--text); }
input[type=text], input[type=url], input[type=number], input[type=date], input[type=password], input[type=email], textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg);
}
textarea { min-height: 140px; resize: vertical; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
textarea.note { min-height: 60px; font-family: var(--font); }
input[type=checkbox] { transform: scale(1.15); margin-right: 6px; }
select { padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); }
select.lang { padding: 2px 4px; font-size: 12px; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--chip); }
tr.current td { background: var(--chip); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin: 0 0 12px; }
.card.alert { border-color: var(--bad); }
.space { margin-top: 16px; }
.narrow { max-width: 560px; }
.medium { max-width: 760px; }
.wide-page { max-width: 900px; }
.pre { white-space: pre-line; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* work bar */
.bar-head { padding: 12px 16px; border-bottom: 1px solid var(--line); }
.bar-head .app { font-weight: 700; }
.bar-nav { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.bar-body { padding: 14px 16px; flex: 1; }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.pager .pos { color: var(--muted); font-size: 13px; }
.field { display: flex; gap: 6px; align-items: center; margin: 6px 0; }
.field .k { width: 92px; color: var(--muted); font-size: 13px; flex: none; }
.field .v { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; padding: 5px 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
.instructions { border-left: 3px solid var(--accent); padding: 2px 0 2px 12px; margin: 12px 0; }
.instructions :first-child { margin-top: 0; }
.instructions :last-child { margin-bottom: 0; }
.finish { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
#toast { position: fixed; left: 16px; bottom: 16px; max-width: min(420px, calc(100vw - 32px)); z-index: 30; display: flex; flex-direction: column; gap: 8px; }
#toast div { background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: var(--radius); box-shadow: 0 4px 16px rgba(0,0,0,.2); }
#toast div.err { background: var(--bad); color: #fff; }

/* stage */
#portal { position: absolute; inset: 36px 0 0 0; width: 100%; height: calc(100% - 36px); border: 0; background: #fff; }
#portal-strip { position: absolute; top: 0; left: 0; right: 0; height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--panel); font-size: 13px; }
#loading { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--muted); padding: 24px; }
.spinner { width: 18px; height: 18px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-right: 10px; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.secret-once { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; word-break: break-all; background: var(--chip-warn); padding: 10px; border-radius: var(--radius); }

/* modal */
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
#modal .box { background: var(--panel); border-radius: 12px; padding: 22px 24px; width: min(460px, 100%); max-height: 90vh; overflow: auto; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <main id="stage">
    <div id="loading"><div class="spinner"></div><span data-ref="text" data-i18n="app.loading">Loading …</span></div>
    <div id="portal-strip" hidden></div>
    <iframe id="portal" hidden title="Portal" data-i18n-title="portal.frame_title"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads allow-modals"
      referrerpolicy="no-referrer"></iframe>
    <section id="view"></section>
  </main>
  <aside id="bar"></aside>
</div>
<div id="modal" hidden><div class="box" id="modal-box"></div></div>
<div id="toast" aria-live="polite"></div>

<!-- ================================================================ building blocks
     Every piece of the interface is here, in English. The script clones a block, fills
     [data-field] with textContent, shows or hides [data-ref] parts and binds [data-action].
     A text carries a data-i18n attribute naming its key; other languages replace the
     text from i18n/<code>.json. -->

<!-- texts the script needs on its own: toasts, questions, chips, short phrases -->
<template id="messages"><div>
  <span data-msg="app.insecure" data-i18n="app.insecure">This page needs HTTPS (or localhost) so that encryption and the clipboard work in the browser. Open it through the service's HTTPS address.</span>
  <span data-msg="app.unreadable" data-i18n="app.unreadable">The service answers unintelligibly (HTTP <span data-field="status"></span>).</span>
  <span data-msg="copy.done" data-i18n="copy.done">Copied ✓</span>
  <span data-msg="device.guess" data-i18n="device.guess"><span data-field="browser"></span> on <span data-field="os"></span></span>
  <span data-msg="urgency.overdue.one" class="chip bad" data-i18n="urgency.overdue.one">overdue by 1 day</span>
  <span data-msg="urgency.overdue.other" class="chip bad" data-i18n="urgency.overdue.other">overdue by <span data-field="n"></span> days</span>
  <span data-msg="urgency.today" class="chip warn" data-i18n="urgency.today">due today</span>
  <span data-msg="urgency.tomorrow" class="chip warn" data-i18n="urgency.tomorrow">due tomorrow</span>
  <span data-msg="urgency.in" class="chip" data-i18n="urgency.in">due in <span data-field="n"></span> days</span>
  <span data-msg="outcome.succeeded" class="chip ok" data-i18n="outcome.succeeded">succeeded</span>
  <span data-msg="outcome.failed" class="chip bad" data-i18n="outcome.failed">failed</span>
  <span data-msg="schedule.one" data-i18n="schedule.one">due <span data-field="date"></span> · every week</span>
  <span data-msg="schedule.other" data-i18n="schedule.other">due <span data-field="date"></span> · every <span data-field="n"></span> weeks</span>
  <span data-msg="retry.one" data-i18n="retry.one">· after a failure, due again in 1 day</span>
  <span data-msg="retry.other" data-i18n="retry.other">· after a failure, due again in <span data-field="n"></span> days</span>
  <span data-msg="last.by" data-i18n="last.by"><span data-field="when"></span> by <span data-field="by"></span></span>
  <span data-msg="weeks.short" data-i18n="weeks.short"><span data-field="n"></span> wk.</span>
  <span data-msg="toast.completed" data-i18n="toast.completed">Closed – due again on <span data-field="date"></span>.</span>
  <span data-msg="toast.saved" data-i18n="toast.saved">Saved.</span>
  <span data-msg="toast.created" data-i18n="toast.created">Created.</span>
  <span data-msg="toast.deleted" data-i18n="toast.deleted">Deleted.</span>
  <span data-msg="toast.welcome" data-i18n="toast.welcome">Welcome, <span data-field="name"></span>.</span>
  <span data-msg="toast.popup_blocked" data-i18n="toast.popup_blocked">The window was blocked. Allow pop-ups for this page and click “Run” again.</span>
  <span data-msg="toast.popup_redirect" data-i18n="toast.popup_redirect">The portal window could not be redirected; close it and click “Run” again.</span>
  <span data-msg="toast.choose_file" data-i18n="toast.choose_file">Choose a backup file first.</span>
  <span data-msg="vault.toast.key_not_kept" data-i18n="vault.toast.key_not_kept">This browser could not keep the key; after reloading, the passphrase has to be entered again.</span>
  <span data-msg="vault.toast.locked" data-i18n="vault.toast.locked">Vault locked.</span>
  <span data-msg="vault.toast.created" data-i18n="vault.toast.created">Vault created.</span>
  <span data-msg="vault.toast.exists_meanwhile" data-i18n="vault.toast.exists_meanwhile">Somebody else has created the vault meanwhile; enter their passphrase.</span>
  <span data-msg="vault.toast.too_short" data-i18n="vault.toast.too_short">The passphrase needs at least 12 characters.</span>
  <span data-msg="vault.toast.mismatch" data-i18n="vault.toast.mismatch">The two entries do not match.</span>
  <span data-msg="vault.toast.wrong" data-i18n="vault.toast.wrong">The passphrase does not fit this vault.</span>
  <span data-msg="confirm.finish.succeeded" data-i18n="confirm.finish.succeeded">Close “<span data-field="title"></span>” as “succeeded”?</span>
  <span data-msg="confirm.finish.failed" data-i18n="confirm.finish.failed">Close “<span data-field="title"></span>” as “failed”?</span>
  <span data-msg="confirm.job.delete" data-i18n="confirm.job.delete">Delete “<span data-field="title"></span>” and its history for good?</span>
  <span data-msg="confirm.device.self" data-i18n="confirm.device.self">Sign this device out? Afterwards you need your invitation link again.</span>
  <span data-msg="confirm.device.other" data-i18n="confirm.device.other">Revoke “<span data-field="label"></span>”?</span>
  <span data-msg="confirm.person.device" data-i18n="confirm.person.device">Revoke the device “<span data-field="label"></span>” of <span data-field="name"></span>?</span>
  <span data-msg="confirm.person.admin_take" data-i18n="confirm.person.admin_take">Take the right to administer people from <span data-field="name"></span>?</span>
  <span data-msg="confirm.person.admin_give" data-i18n="confirm.person.admin_give">Give <span data-field="name"></span> the right to administer people?</span>
  <span data-msg="confirm.person.deactivate" data-i18n="confirm.person.deactivate">Deactivate <span data-field="name"></span> on all devices?</span>
  <span data-msg="confirm.invitation.withdraw" data-i18n="confirm.invitation.withdraw">Withdraw the invitation? Devices already signed in stay signed in.</span>
  <span data-msg="confirm.agent.grant" data-i18n="confirm.agent.grant">Give agent <span data-field="display"></span> the right “<span data-field="ability"></span>”? Grant it only if the agent told you exactly this display string.</span>
  <span data-msg="confirm.agent.reject" data-i18n="confirm.agent.reject">Reject the registration <span data-field="display"></span>?</span>
  <span data-msg="confirm.agent.revoke" data-i18n="confirm.agent.revoke">Revoke agent <span data-field="display"></span> at once?</span>
  <span data-msg="confirm.token.create" data-i18n="confirm.token.create">Create a token with the right “<span data-field="ability"></span>”?</span>
  <span data-msg="confirm.import" data-i18n="confirm.import">Import the backup? Nothing is overwritten: what exists already comes in as “… (Import date)”.</span>
  <span data-msg="confirm.import.delete" data-i18n="confirm.import.delete">Delete “<span data-field="name"></span>”?</span>
  <span data-msg="ability.jobs.read" data-i18n="ability.jobs.read">Read jobs</span>
  <span data-msg="ability.jobs.write" data-i18n="ability.jobs.write">Change jobs</span>
  <span data-msg="ability.jobs.complete" data-i18n="ability.jobs.complete">Close runs</span>
  <span data-msg="ability.backup.read" data-i18n="ability.backup.read">Take the backup</span>
  <span data-msg="agent.state.pending" class="chip" data-i18n="agent.state.pending">waiting for a grant</span>
  <span data-msg="agent.state.granted" class="chip ok" data-i18n="agent.state.granted">granted</span>
  <span data-msg="agent.state.expired" class="chip bad" data-i18n="agent.state.expired">expired</span>
  <span data-msg="agent.state.revoked" class="chip bad" data-i18n="agent.state.revoked">revoked</span>
  <span data-msg="agent.expires" data-i18n="agent.expires">expires <span data-field="date"></span></span>
  <span data-msg="agent.registered" data-i18n="agent.registered">registered <span data-field="date"></span></span>
  <span data-msg="agent.granted_by" data-i18n="agent.granted_by">· granted by <span data-field="name"></span></span>
  <span data-msg="agent.last_used" data-i18n="agent.last_used">· last used <span data-field="date"></span></span>
  <span data-msg="agent.never_used" data-i18n="agent.never_used">· never used</span>
  <span data-msg="agent.done" data-i18n="agent.done"><span data-field="n"></span> expired or revoked</span>
  <span data-msg="invitation.state.open" class="chip ok" data-i18n="invitation.state.open">open</span>
  <span data-msg="invitation.state.expired" class="chip" data-i18n="invitation.state.expired">expired</span>
  <span data-msg="invitation.state.withdrawn" class="chip" data-i18n="invitation.state.withdrawn">withdrawn</span>
  <span data-msg="import.vault.adopted" data-i18n="import.vault.adopted">Vault taken from the backup – its passphrase applies.</span>
  <span data-msg="import.vault.same" data-i18n="import.vault.same">Same vault – the logins work.</span>
  <span data-msg="import.vault.different" data-i18n="import.vault.different">Different vault – logins from the backup were left out.</span>
  <span data-msg="import.vault.none" data-i18n="import.vault.none">No vault in the backup.</span>
  <span data-msg="import.logins_dropped" data-i18n="import.logins_dropped"><span data-field="n"></span> logins left out.</span>
  <span data-msg="import.kind.job" data-i18n="import.kind.job">Job</span>
  <span data-msg="import.kind.person" data-i18n="import.kind.person">Person</span>
  <span data-msg="line.curl" translate="no">curl -fsS -H "Authorization: Bearer <span data-field="token"></span>" <span data-field="url"></span> -o portal-download-$(date +%F).jsonl</span>
  <span data-msg="line.env" translate="no">export PORTAL_DOWNLOAD_AGENT_TOKEN=<span data-field="token"></span></span>
</div></template>

<template id="tpl-toast"><div></div></template>
<template id="tpl-muted-line"><div class="muted" data-field="text"></div></template>
<template id="tpl-copy-area"><textarea></textarea></template>
<template id="tpl-option"><option></option></template>

<template id="tpl-confirm"><div>
  <p class="pre" data-field="text"></p>
  <div class="row space">
    <button class="btn primary" type="button" data-action="yes" data-i18n="confirm.yes">OK</button>
    <button class="btn" type="button" data-action="no" data-i18n="confirm.no">Cancel</button>
  </div>
</div></template>

<!-- work bar, right side -->
<template id="tpl-bar-head"><div class="bar-head">
  <div class="row">
    <span class="app grow" data-field="app_name"></span>
    <span class="muted small" data-field="me_name"></span>
    <select class="lang" data-ref="lang" data-action="lang" aria-label="Language" data-i18n-aria-label="lang.label"></select>
  </div>
  <div class="bar-nav small" data-ref="nav">
    <a href="#/" data-i18n="nav.overview">Overview</a> ·
    <a href="#/new" data-i18n="nav.new">New job</a>
    <span data-ref="nav-people">· <a href="#/people" data-i18n="nav.people">People</a></span> ·
    <a href="#/devices" data-i18n="nav.devices">My devices</a>
    <span data-ref="vault-ctl">·
      <button class="btn link small" type="button" data-ref="vault-lock" data-action="vault-lock" data-i18n="vault.lock">Lock vault</button>
      <button class="btn link small" type="button" data-ref="vault-unlock" data-action="vault-open" data-i18n="vault.unlock">Unlock vault</button>
      <button class="btn link small" type="button" data-ref="vault-create" data-action="vault-open" data-i18n="vault.create">Create vault</button>
    </span>
  </div>
</div></template>

<template id="tpl-bar-body"><div class="bar-body"></div></template>

<template id="tpl-bar-empty"><div>
  <p class="muted" data-i18n="bar.empty">No download jobs yet.</p>
  <a class="btn primary" href="#/new" data-i18n="bar.first">Create the first job</a>
</div></template>

<template id="tpl-current"><div>
  <div class="pager">
    <button class="btn icon" type="button" data-action="prev" title="more urgent" data-i18n-title="pager.prev_title" aria-label="previous job" data-i18n-aria-label="pager.prev">◀</button>
    <span class="pos" data-i18n="pager.pos"><span data-field="pos"></span> of <span data-field="n"></span></span>
    <button class="btn icon" type="button" data-action="next" title="less urgent" data-i18n-title="pager.next_title" aria-label="next job" data-i18n-aria-label="pager.next">▶</button>
  </div>
  <h1 data-field="title"></h1>
  <div class="row"><span data-ref="urgency"></span><span class="muted small" data-ref="schedule"></span></div>
  <div class="muted small" style="margin-top:4px" data-ref="last"><span data-i18n="current.last">Last:</span> <span data-ref="last-outcome"></span> <span data-ref="last-text"></span></div>
  <div style="margin:14px 0 8px">
    <button class="btn primary wide" type="button" data-action="run"><span data-ref="run-frame" data-i18n="current.run">Run</span><span data-ref="run-window" data-i18n="current.run_window">Run (opens a window)</span></button>
  </div>
  <div data-ref="creds"></div>
  <div data-ref="instructions"></div>
  <textarea class="note" data-ref="note" placeholder="Note (optional), e.g. what was missing" data-i18n-placeholder="current.note"></textarea>
  <div class="finish">
    <button class="btn ok" type="button" data-action="succeeded" data-i18n="current.succeeded">Succeeded</button>
    <button class="btn bad" type="button" data-action="failed" data-i18n="current.failed">Failed</button>
  </div>
  <div class="row small" style="margin-top:14px">
    <a data-ref="edit" data-i18n="current.edit">Edit</a> · <a data-ref="history" data-i18n="current.history">History</a>
    <span class="muted" data-ref="retry"></span>
  </div>
</div></template>

<template id="tpl-instructions"><div class="instructions"></div></template>
<template id="tpl-no-instructions"><p class="muted small" data-i18n="current.no_instructions">No instructions stored.</p></template>
<template id="tpl-creds-decrypting"><div class="muted small" data-i18n="creds.decrypting">Decrypting the login …</div></template>
<template id="tpl-creds-none"><p class="muted small" data-i18n="creds.none">No login stored.</p></template>
<template id="tpl-creds-locked"><div class="row small">
  <span class="muted grow" data-i18n="creds.locked">The login is in the locked vault.</span>
  <button class="btn" type="button" data-action="unlock" data-i18n="creds.unlock">Unlock</button>
</div></template>
<template id="tpl-creds-error"><p class="small" style="color:var(--bad)" data-i18n="creds.error">The login cannot be decrypted with this vault key. Enter it again under “Edit”.</p></template>
<template id="tpl-creds-user"><div class="field">
  <span class="k" data-i18n="creds.username">Username</span>
  <span class="v" data-field="value"></span>
  <button class="btn icon small" type="button" data-action="copy" data-i18n="creds.copy">Copy</button>

<script>
"use strict";
/* Portal-Download – the whole application. The markup above holds every building block as a
   <template> in English; this script clones the blocks, fills values with textContent only,
   shows or hides their parts and binds their actions. Another language replaces the texts of
   the blocks once from i18n/<code>.json. Every piece of content arrives through the API.
   Vendored libraries: none. */

// ------------------------------------------------------------------ building blocks
const $ = (s) => document.querySelector(s);
function T(id) { return document.getElementById(id).content.firstElementChild.cloneNode(true); }
function ref(root, name) { return root.dataset.ref === name ? root : root.querySelector(`[data-ref="${name}"]`); }
function put(root, values) {
  const els = root.dataset.field !== undefined ? [root, ...root.querySelectorAll("[data-field]")] : root.querySelectorAll("[data-field]");
  for (const el of els) if (el.dataset.field in values) el.textContent = values[el.dataset.field] == null ? "" : String(values[el.dataset.field]);

const LANG_KEY = "portal-download.lang";

    for (const a of ["placeholder", "title", "aria-label"]) if (el.hasAttribute(`data-i18n-${a}`)) o.attrs[a] = el.getAttribute(a) || "";

}
function translate(root) {

    const o = original(el);
    if (el.dataset.i18n) {
      const pattern = I18N.dict[el.dataset.i18n] ?? o.pattern;
      const nodes = [];
      pattern.split(/\{(\w+)\}/).forEach((s, i) => {
        if (i % 2) { const f = o.fields.get(s); if (f) nodes.push(f); }
        else if (s) nodes.push(document.createTextNode(s));

    for (const [a, v] of Object.entries(o.attrs)) el.setAttribute(a, I18N.dict[el.getAttribute(`data-i18n-${a}`)] ?? v);
  }
}
function translateAll() {

  for (const k of Object.keys(MSG)) delete MSG[k];

  document.documentElement.lang = I18N.code;
}

}
const msg = (key, values) => msgNode(key, values).textContent;
const plural = (key, n, values = {}) => msgNode(`${key}.${n === 1 ? "one" : "other"}`, { n, ...values });

// ------------------------------------------------------------------ API
let CONFIG = { app_name: "Portal-Download", api: "api/", languages: [{ code: "en", label: "English" }] };
let seq = 0;
async function rpc(method, params = {}, headers = {}) {
  const res = await fetch(CONFIG.api, {
    method: "POST", credentials: "same-origin",
    headers: { "Content-Type": "application/json", ...headers },
    body: JSON.stringify({ jsonrpc: "2.0", method, params, id: ++seq }),
  });
  let body;
  try { body = await res.json(); } catch { throw new Error(msg("app.unreadable", { status: res.status })); }
  if (body.error) { const e = new Error(body.error.message); e.code = body.error.code; e.type = body.error.data && body.error.data.type; throw e; }

}

// ------------------------------------------------------------------ vault (browser only)
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const VERIFIER_TEXT = "portal-download vault check";
const vault = { meta: null, key: null };

function idb() {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open("portal-download", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("keys");
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
async function idbDo(mode, fn) {
  const db = await idb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("keys", mode);
    const req = fn(tx.objectStore("keys"));
    tx.oncomplete = () => { db.close(); resolve(req && req.result); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  });
}
async function deriveKey(passphrase, saltB64, iterations) {
  const base = await crypto.subtle.importKey("raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: unb64(saltB64), iterations }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function seal(key, purpose, plain) {
  if (!plain) return "";
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv, additionalData: enc.encode(purpose) }, key, enc.encode(plain));
  return JSON.stringify({ v: 1, iv: b64(iv), ct: b64(ct) });
}
async function unseal(key, purpose, sealed) {
  if (!sealed) return "";
  const o = JSON.parse(sealed);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(o.iv), additionalData: enc.encode(purpose) }, key, unb64(o.ct));
  return dec.decode(pt);
}
async function keyFits(key) {
  try { return (await unseal(key, "verifier", vault.meta.verifier)) === VERIFIER_TEXT; } catch { return false; }
}
async function loadVault() {
  vault.meta = await rpc("vault.get");
  vault.key = null;
  if (!vault.meta.exists) return;
  try {
    const stored = await idbDo("readonly", (s) => s.get("vault"));
    if (stored && stored.salt === vault.meta.salt && (await keyFits(stored.key))) vault.key = stored.key;
  } catch (e) { console.warn(e); }
}
async function rememberKey(key) {
  try { await idbDo("readwrite", (s) => s.put({ salt: vault.meta.salt, key }, "vault")); }
  catch { toast(msg("vault.toast.key_not_kept"), true); }
}
async function lockVault() {
  vault.key = null;
  try { await idbDo("readwrite", (s) => s.delete("vault")); } catch {}
  decrypted.clear();
  toast(msg("vault.toast.locked"));
  render();
}
const decrypted = new Map(); // sealed username + sealed password -> {username, password}
async function credsOf(job) {
  if (!vault.key) return null;
  const k = job.username_sealed + "\n" + job.password_sealed;
  if (decrypted.has(k)) return decrypted.get(k);
  try {
    const c = { username: await unseal(vault.key, "username", job.username_sealed), password: await unseal(vault.key, "password", job.password_sealed) };
    decrypted.set(k, c);
    return c;
  } catch { return { error: true }; }
}
function vaultDialog() {
  if (!vault.meta) return;
  if (!vault.meta.exists) {
    const d = T("tpl-vault-create");
    const submit = ref(d, "submit");
    bind(d, {
      later: closeModal,
      create: async () => {
        const p1 = ref(d, "p1").value, p2 = ref(d, "p2").value;
        if (p1.length < 12) return toast(msg("vault.toast.too_short"), true);
        if (p1 !== p2) return toast(msg("vault.toast.mismatch"), true);
        submit.disabled = true;
        try {
          const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
          const key = await deriveKey(p1, salt, 600000);
          vault.meta = await rpc("vault.create", { salt, iterations: 600000, verifier: await seal(key, "verifier", VERIFIER_TEXT) });
          vault.key = key; await rememberKey(key); closeModal(); toast(msg("vault.toast.created")); render();
        } catch (e) {
          if (e.type === "vault_exists") { closeModal(); toast(msg("vault.toast.exists_meanwhile"), true); await loadVault(); vaultDialog(); return; }
          submit.disabled = false; fail(e);
        }
      },
    });
    openModal(d);
    return;
  }
  const d = T("tpl-vault-unlock");
  const submit = ref(d, "submit");
  bind(d, {
    later: closeModal,
    unlock: async () => {
      submit.disabled = true;
      try {
        const key = await deriveKey(ref(d, "p").value, vault.meta.salt, vault.meta.iterations);
        if (!(await keyFits(key))) { submit.disabled = false; return toast(msg("vault.toast.wrong"), true); }
        vault.key = key; await rememberKey(key); closeModal(); render();
      } catch (e) { submit.disabled = false; fail(e); }
    },
  });
  openModal(d);
}

// ------------------------------------------------------------------ state & routing
const state = { status: null, me: null, jobs: [], today: null, current: 0, running: null, importReport: null, authError: null };

function route() {
  const f = location.hash.replace(/^#/, "");
  if (f.startsWith("invite=")) {
    let token = "";
    try { token = decodeURIComponent(f.slice(7)); } catch {}
    return { view: "invite", token };
  }
  const parts = f.replace(/^\//, "").split("/").filter(Boolean);
  const id = parts[1] ? Number(parts[1]) : null;
  if (parts[1] && !Number.isInteger(id)) return { view: "work", id: null };
  return { view: parts[0] || "work", id };
}
function go(fragment) { if (location.hash !== fragment) location.hash = fragment; else render(); }
window.addEventListener("hashchange", () => render());

async function loadJobs() {
  const r = await rpc("job.list");
  state.jobs = r.jobs; state.today = r.today;
  const live = new Set(state.jobs.map((j) => j.username_sealed + "\n" + j.password_sealed));
  for (const k of [...decrypted.keys()]) if (!live.has(k)) decrypted.delete(k);
  if (state.current >= state.jobs.length) state.current = Math.max(0, state.jobs.length - 1);
}
const currentJob = () => state.jobs[state.current] || null;
function selectJob(id) {
  const i = state.jobs.findIndex((j) => j.job_id === id);
  if (i >= 0) state.current = i;
}

// ------------------------------------------------------------------ portal (left side)
function openPortalWindow(url) {
  const w = Math.round((screen.availWidth || 1280) * 0.75), hgt = screen.availHeight || 800;
  const win = window.open("", "pd-portal", `popup=yes,width=${w},height=${hgt},left=${screen.availLeft || 0},top=${screen.availTop || 0}`);
  if (!win) { toast(msg("toast.popup_blocked"), true); return; }
  // A new window is still about:blank and ours: cut the way back before loading the portal.
  // A window reused from an earlier run is on the portal's origin; there opener is not ours to set.
  try { win.opener = null; } catch {}
  try { win.location.href = url; } catch { toast(msg("toast.popup_redirect"), true); return; }
  try { win.focus(); } catch {}
}
function run(job) {
  state.running = job.job_id;
  if (!job.embeddable) openPortalWindow(job.entry_url);
  go(`#/run/${job.job_id}`);
}

function renderCurrent(job) {
  const n = state.jobs.length;
  const d = put(T("tpl-current"), { pos: state.current + 1, n, title: job.title });
  d.querySelector('[data-action="prev"]').disabled = state.current === 0;
  d.querySelector('[data-action="next"]').disabled = state.current >= n - 1;
  ref(d, "urgency").replaceWith(urgency(job.urgency_days));
  ref(d, "schedule").textContent = plural("schedule", job.interval_weeks, { date: fmtDate(job.next_due) }).textContent;
  const last = job.last_run;
  show(ref(d, "last"), !!last);
  if (last) {
    ref(d, "last-outcome").replaceWith(outcomeChip(last.outcome));
    ref(d, "last-text").textContent = msg("last.by", { when: fmtDateTime(last.finished_at), by: last.by });
  }
  show(ref(d, "run-frame"), job.embeddable);
  show(ref(d, "run-window"), !job.embeddable);
  const creds = ref(d, "creds");
  creds.replaceChildren(T("tpl-creds-decrypting"));
  fillCreds(job, creds);
  ref(d, "instructions").replaceWith(job.instructions_html ? instructionsBlock(job.instructions_html) : T("tpl-no-instructions"));
  ref(d, "edit").href = `#/edit/${job.job_id}`;
  ref(d, "history").href = `#/history/${job.job_id}`;
  ref(d, "retry").textContent = plural("retry", job.retry_days).textContent;
  const note = ref(d, "note");
  const finish = async (outcome) => {
    if (!(await ask(msg(`confirm.finish.${outcome}`, { title: job.title })))) return;
    try {
      const r = await rpc("job.complete", { job_id: job.job_id, outcome, note: note.value, expected_run_count: job.run_count });
      toast(msg("toast.completed", { date: fmtDate(r.next_due) }));
      if (state.running === job.job_id) state.running = null;
      await loadJobs(); state.current = 0;
      go(state.jobs.length ? `#/job/${state.jobs[0].job_id}` : "#/");
    } catch (e) {
      fail(e);
      if (e.type === "job_changed") { await loadJobs(); render(); }
    }
  };
  return bind(d, {
    prev: () => { state.current--; go(`#/job/${currentJob().job_id}`); },
    next: () => { state.current++; go(`#/job/${currentJob().job_id}`); },
    run: () => run(job),
    succeeded: () => finish("succeeded"),
    failed: () => finish("failed"),

}

  if (job.password_sealed) {

  f("embeddable").checked = job ? job.embeddable : false;
  f("interval_weeks").value = job ? job.interval_weeks : 4;
  f("retry_days").value = job ? job.retry_days : 2;
  f("next_due").value = job ? job.next_due : state.today;
  f("instructions_md").value = job ? job.instructions_md : "";
  f("username").value = c && !c.error ? c.username : "";
  f("password").value = c && !c.error ? c.password : "";
  f("username").disabled = !canCreds; f("password").disabled = !canCreds;
  show(f("locked"), !canCreds);
  show(f("unlock"), !!vault.meta && vault.meta.exists);
  show(f("create-vault"), !vault.meta || !vault.meta.exists);
  f("cancel").href = job ? `#/job/${job.job_id}` : "#/";
  const touched = { username: false, password: false };
  f("username").addEventListener("input", () => (touched.username = true));
  f("password").addEventListener("input", () => (touched.password = true));
  const save = f("save");
  return bind(d, {
    "vault-open": vaultDialog,
    "toggle-password": () => { const hide = f("password").type === "text"; f("password").type = hide ? "password" : "text"; show(f("pw-show"), hide); show(f("pw-hide"), !hide); },
    delete: async () => {
      if (!(await ask(msg("confirm.job.delete", { title: job.title })))) return;
      try { await rpc("job.delete", { job_id: job.job_id }); await loadJobs(); toast(msg("toast.deleted")); go("#/"); } catch (e) { fail(e); }
    },
    save: async () => {
      save.disabled = true;
      try {
        const all = {
          title: f("title").value, entry_url: f("entry_url").value.trim(), embeddable: f("embeddable").checked,
          interval_weeks: Number(f("interval_weeks").value), retry_days: Number(f("retry_days").value), next_due: f("next_due").value,
          instructions_md: f("instructions_md").value,
        };
        // When editing, send only what was changed, so that a concurrent change by somebody else survives.
        const p = {};
        for (const [k, v] of Object.entries(all)) if (!job || job[k] !== v) p[k] = v;
        if (canCreds && (!job || touched.username)) p.username_sealed = await seal(vault.key, "username", f("username").value);
        if (canCreds && (!job || touched.password)) p.password_sealed = await seal(vault.key, "password", f("password").value);
        const r = job ? await rpc("job.update", { job_id: job.job_id, ...p }) : await rpc("job.create", p);
        await loadJobs(); selectJob(r.job_id);
        toast(msg(job ? "toast.saved" : "toast.created"));
        go(`#/job/${r.job_id}`);
      } catch (e) { save.disabled = false; fail(e); }
    },
  });
}

async function viewHistory(id) {
  const job = state.jobs.find((j) => j.job_id === id);
  if (!job) return T("tpl-gone");
  const r = await rpc("job.history", { job_id: id });
  const d = put(T("tpl-history"), { title: job.title });
  for (const x of r.runs) {
    const tr = put(T("tpl-history-row"), { closed: fmtDateTime(x.finished_at), by: x.by, before: fmtDate(x.due_before), after: fmtDate(x.due_after), note: x.note });
    ref(tr, "outcome").append(outcomeChip(x.outcome));
    ref(d, "rows").append(tr);
  }
  show(ref(d, "table"), r.runs.length > 0);
  show(ref(d, "empty"), r.runs.length === 0);
  ref(d, "back").href = `#/job/${id}`;
  return d;
}

async function viewDevices() {
  const r = await rpc("device.list");
  const d = T("tpl-devices");
  for (const dev of r.devices) {
    const self = dev.device_id === r.current_device_id;
    const tr = put(T("tpl-device-row"), { label: dev.label, seen: fmtDateTime(dev.last_seen_at), address: dev.last_address, agent: dev.user_agent.slice(0, 80) });
    show(ref(tr, "this"), self); show(ref(tr, "revoked"), !!dev.revoked_at);
    show(ref(tr, "revoke"), !dev.revoked_at); show(ref(tr, "sign-out"), self); show(ref(tr, "revoke-other"), !self);
    bind(tr, {
      revoke: async () => {
        if (!(await ask(self ? msg("confirm.device.self") : msg("confirm.device.other", { label: dev.label })))) return;
        try { await rpc("device.revoke", { device_id: dev.device_id }); if (self) { location.hash = ""; location.reload(); } else render(); } catch (e) { fail(e); }
      },
    });
    ref(d, "rows").append(tr);
  }
  return d;
}

function inviteLink(token) { return `${location.origin}${location.pathname}#invite=${encodeURIComponent(token)}`; }
function showInvitation(name, r) {
  const link = inviteLink(r.invitation_token);
  lineDialog("tpl-invitation-dialog", { name, expires: fmtDateTime(r.expires_at), link }, link);
}
const backupUrl = () => new URL("backup", location.href.split("#")[0]).href;
const curlLine = (token) => msg("line.curl", { token, url: backupUrl() });
/** Shows a token once; for the backup ability with the ready curl line. */
function showToken(r) {
  const backup = r.ability === "backup.read";
  lineDialog("tpl-token-dialog", { display: r.display }, backup ? curlLine(r.token) : msg("line.env", { token: r.token }), { backup, env: !backup });
}
function showBackupLine(display) {
  lineDialog("tpl-backup-line-dialog", { display }, curlLine("$PORTAL_DOWNLOAD_AGENT_TOKEN"));
}

async function viewPeople() {
  if (!state.me.is_admin) return T("tpl-people-forbidden");
  const [r, ag] = await Promise.all([rpc("user.list"), rpc("agent.list")]);
  const d = T("tpl-people");
  const act = (question, fn) => async () => { if (question && !(await ask(question))) return; try { await fn(); render(); } catch (e) { fail(e); } };
  const options = (select, selected) => {
    for (const x of ag.abilities) {
      const o = T("tpl-option");
      o.value = x.ability; o.textContent = abilityName(x.ability); o.title = x.permits; o.selected = x.ability === selected;
      select.append(o);
    }
  };

  const invite = ref(d, "invite");
  for (const u of r.users) {
    const card = put(T("tpl-person"), { name: u.name, email: u.email });
    show(ref(card, "is-admin"), u.is_admin); show(ref(card, "inactive"), !u.active);
    show(ref(card, "admin-take"), u.is_admin); show(ref(card, "admin-give"), !u.is_admin);
    show(ref(card, "deactivate"), u.active); show(ref(card, "reactivate"), !u.active);
    bind(card, {
      reinvite: async () => { try { showInvitation(u.name, await rpc("user.reinvite", { user_id: u.user_id })); } catch (e) { fail(e); } },
      admin: act(msg(u.is_admin ? "confirm.person.admin_take" : "confirm.person.admin_give", { name: u.name }), () => rpc("user.setAdmin", { user_id: u.user_id, is_admin: !u.is_admin })),
      active: act(u.active ? msg("confirm.person.deactivate", { name: u.name }) : null, () => rpc("user.setActive", { user_id: u.user_id, active: !u.active })),
    });
    for (const dev of u.devices) {
      const tr = put(T("tpl-person-device"), { label: dev.label, seen: fmtDateTime(dev.last_seen_at), address: dev.last_address, invitation: dev.invitation_id });
      show(ref(tr, "revoked"), !!dev.revoked_at); show(ref(tr, "revoke"), !dev.revoked_at);
      bind(tr, { revoke: act(msg("confirm.person.device", { label: dev.label, name: u.name }), () => rpc("device.revoke", { device_id: dev.device_id })) });
      ref(card, "rows").append(tr);
    }
    for (const i of u.invitations) {
      const tr = put(T("tpl-person-invitation"), { id: i.invitation_id, created: fmtDateTime(i.created_at), expires: fmtDateTime(i.expires_at) });
      ref(tr, "state").append(msgNode(`invitation.state.${i.state}`));
      show(ref(tr, "withdraw"), i.state === "open");
      bind(tr, { withdraw: act(msg("confirm.invitation.withdraw"), () => rpc("invitation.withdraw", { invitation_id: i.invitation_id })) });
      ref(card, "rows").append(tr);
    }
    ref(d, "people").append(card);
  }

  const agentCard = (a) => {
    const card = put(T("tpl-agent"), { display: a.display, introduction: a.introduction });
    ref(card, "state").append(msgNode(`agent.state.${a.state}`));
    const ab = ref(card, "ability");
    if (a.ability) ab.textContent = abilityName(a.ability); else show(ab, false);
    const active = a.state === "pending" || a.state === "granted";
    ref(card, "expires").textContent = active ? msg("agent.expires", { date: fmtDateTime(a.expires_at) }) : "";
    const meta = [msg("agent.registered", { date: fmtDateTime(a.created_at) })];
    if (a.granted_by) meta.push(msg("agent.granted_by", { name: a.granted_by }));
    meta.push(a.last_used_at ? msg("agent.last_used", { date: fmtDateTime(a.last_used_at) }) : msg("agent.never_used"));
    ref(card, "meta").textContent = meta.join(" ");
    show(ref(card, "pending"), a.state === "pending");
    show(ref(card, "granted"), a.state === "granted");
    const pick = ref(card, "pick");
    options(pick, null);
    return bind(card, {
      grant: async () => {
        const chosen = pick.value;
        if (!(await ask(msg("confirm.agent.grant", { display: a.display, ability: abilityName(chosen) })))) return;
        try { await rpc("agent.grant", { agent_id: a.agent_id, ability: chosen }); if (chosen === "backup.read") showBackupLine(a.display); else render(); } catch (e) { fail(e); }
      },
      reject: act(msg("confirm.agent.reject", { display: a.display }), () => rpc("agent.revoke", { agent_id: a.agent_id })),
      revoke: act(msg("confirm.agent.revoke", { display: a.display }), () => rpc("agent.revoke", { agent_id: a.agent_id })),
    });
  };
  const live = ag.agents.filter((a) => a.state === "pending" || a.state === "granted");
  const done = ag.agents.filter((a) => !live.includes(a));
  for (const a of live) ref(d, "live").append(agentCard(a));
  show(ref(d, "none"), live.length === 0);
  show(ref(d, "done"), done.length > 0);
  ref(d, "done-summary").textContent = msg("agent.done", { n: done.length });
  for (const a of done) ref(d, "done-list").append(agentCard(a));
  options(ref(d, "ability"), "backup.read");
  ref(d, "download").href = backupUrl();

  return bind(d, {
    invite: async () => {
      const name = ref(invite, "name").value;
      try { showInvitation(name, await rpc("user.create", { name, email: ref(invite, "email").value, is_admin: ref(invite, "admin").checked })); } catch (e) { fail(e); }
    },
    "create-token": async () => {
      const ability = ref(d, "ability").value;
      if (!(await ask(msg("confirm.token.create", { ability: abilityName(ability) })))) return;
      try { showToken(await rpc("agent.create", { introduction: ref(d, "purpose").value, ability })); } catch (e) { fail(e); }
    },
    import: async () => {
      const file = ref(d, "file").files[0];
      if (!file) { toast(msg("toast.choose_file"), true); return; }
      if (!(await ask(msg("confirm.import")))) return;
      try { state.importReport = await rpc("backup.import", { jsonl: await file.text(), include_access: !ref(d, "omit").checked }); go("#/import"); } catch (e) { fail(e); }
    },
  });
}

function viewImport() {
  const r = state.importReport;
  const d = T("tpl-import");
  show(ref(d, "report"), !!r); show(ref(d, "nothing"), !r);
  if (!r) return d;
  put(d, {
    jobs: r.jobs_added, runs: r.runs_added, people: r.people_added, devices: r.devices_added, agents: r.agents_added,
    left_out: r.skipped_left_out, existing: r.skipped_existing, unrelated: r.skipped_unrelated,
    admins: r.admins_added.map((x) => x.name).join(", "),
  });
  ref(d, "vault").textContent = [msg(`import.vault.${r.vault}`), r.logins_dropped ? msg("import.logins_dropped", { n: r.logins_dropped }) : ""].join(" ").trim();
  show(ref(d, "skipped"), !!(r.skipped_left_out || r.skipped_existing || r.skipped_unrelated));
  show(ref(d, "admins"), r.admins_added.length > 0);
  show(ref(d, "renamed"), r.renamed.length > 0);
  show(ref(d, "none"), r.renamed.length === 0);
  for (const x of r.renamed) {
    const tr = put(T("tpl-import-row"), { name: x.name });
    ref(tr, "kind").textContent = msg(`import.kind.${x.kind}`);
    const mark = () => { show(ref(tr, "delete"), false); show(ref(tr, "deleted"), true); };
    if (x.deleted) mark();
    bind(tr, {
      delete: async () => {
        if (!(await ask(msg("confirm.import.delete", { name: x.name })))) return;
        try {
          if (x.kind === "job") await rpc("job.delete", { job_id: x.job_id }); else await rpc("user.delete", { user_id: x.user_id });
          x.deleted = true; mark(); await loadJobs(); renderBar();
        } catch (e) { fail(e); }
      },
    });
    ref(d, "rows").append(tr);
  }
  return d;
}

// ------------------------------------------------------------------ entry states without access
function viewInvite(token) {
  const d = T("tpl-invite");
  ref(d, "label").value = guessDeviceLabel();
  const submit = ref(d, "submit");
  return bind(d, {
    accept: async () => {
      submit.disabled = true;
      try {
        const r = await rpc("invitation.redeem", { token, label: ref(d, "label").value });
        history.replaceState(null, "", location.pathname + "#/");
        toast(msg("toast.welcome", { name: r.name }));
        await boot();
      } catch (e) { submit.disabled = false; fail(e); }
    },
  });
}

function viewSetup() {
  const d = T("tpl-setup");
  return bind(d, {
    setup: async () => {
      try {
        const r = await rpc("setup.createAdmin", { name: ref(d, "name").value, email: ref(d, "email").value }, { "X-Setup-Secret": ref(d, "secret").value.trim() });
        location.hash = "#invite=" + encodeURIComponent(r.invitation_token);
      } catch (e) { fail(e); }
    },
  });
}

function viewNoAccess(err) {
  return put(T("tpl-no-access"), { app_name: CONFIG.app_name, error: err || "" });
}

// ------------------------------------------------------------------ render
let renderSeq = 0;
async function render() {
  const mySeq = ++renderSeq;
  const r = route();
  const view = $("#view");
  if (r.view === "invite") { hidePortal(); renderBarWithoutAccess(); view.replaceChildren(viewInvite(r.token)); return; }
  if (!state.me) {
    hidePortal(); renderBarWithoutAccess();
    view.replaceChildren(state.status && state.status.setup_required ? viewSetup() : viewNoAccess(state.authError));
    return;
  }
  // Others in the circle may have closed or changed jobs: fetch the list on every navigation.
  try { await loadJobs(); } catch (e) {
    if (mySeq !== renderSeq) return;
    if (e.code === 401) { state.me = null; state.authError = e.message; return render(); }
    fail(e);
  }
  if (mySeq !== renderSeq) return;
  if (r.id && ["job", "run", "edit", "history"].includes(r.view)) selectJob(r.id);
  renderBar();
  let content = null;
  try {
    if (r.view === "run") {
      const job = state.jobs.find((j) => j.job_id === r.id);
      content = job ? viewRunning(job) : viewOverview();
      if (!job || !job.embeddable) hidePortal();
    } else {
      hidePortal();
      if (r.view === "new") content = await viewEdit(null);
      else if (r.view === "edit") content = await viewEdit(r.id);
      else if (r.view === "history") content = await viewHistory(r.id);
      else if (r.view === "people") content = await viewPeople();
      else if (r.view === "import") content = viewImport();
      else if (r.view === "devices") content = await viewDevices();
      else content = viewOverview();
    }
  } catch (e) {
    if (mySeq !== renderSeq) return;
    if (e.code === 401) { state.me = null; state.authError = e.message; return render(); }
    fail(e); content = viewOverview();
  }
  if (mySeq !== renderSeq) return; // a newer render has started
  view.replaceChildren(...(content ? [content] : []));
}
function renderBarWithoutAccess() {
  const saved = state.me; state.me = null; renderBar(); state.me = saved;
}

async function boot() {
  try {
    state.status = await rpc("service.status");
    state.me = state.status.me && state.status.me.kind === "person" ? state.status.me : null;
    if (state.me) {
      await Promise.all([loadJobs(), loadVault()]);
      if (vault.meta && (!vault.meta.exists || !vault.key)) vaultDialog();
    }
  } catch (e) {
    state.authError = e.message;
    fail(e);
  } finally {
    $("#loading").hidden = true;
  }
  await render();
}

async function start() {
  try { CONFIG = { ...CONFIG, ...(await (await fetch("config.json", { cache: "no-cache" })).json()) }; } catch (e) { console.error(e); }
  document.title = CONFIG.app_name;
  await setLanguage(chosenLanguage());
  if (!window.isSecureContext || !window.crypto || !crypto.subtle) {
    ref($("#loading"), "text").textContent = msg("app.insecure");
    $("#loading").querySelector(".spinner").hidden = true;
    return;
  }
  await boot();
}
start();
</script>
</body>
</html>
