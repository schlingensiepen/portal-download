# Builds the image for amd64 and arm64, each on a runner of its own architecture,
# proves it with deploy/smoke.sh, and only then publishes it to ghcr.io under one
# multi-platform tag. Pushing uses the run's own GITHUB_TOKEN; nobody stores a secret.
#
# Tags: a release tag vX.Y.Z gives X.Y.Z, X.Y and latest; a push to main gives edge;
# every published build also gets sha-<commit>. A pull request is built and tested,
# never published.
name: Build image
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04, arch: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      # Build into the local daemon first and prove that the image runs. A build that
      # succeeds says the binary compiles; it says nothing about whether both processes
      # start, stop and keep their state, which is what an operator meets first.
      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: portal-download:smoke
          labels: ${{ steps.meta.outputs.labels }}
          build-args: PORTAL_DOWNLOAD_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Smoke test, seven steps
        run: deploy/smoke.sh portal-download:smoke "${{ github.sha }}"

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same build again, now from the cache, pushed by digest only. The tags are
      # set once for both platforms in the publish job.
      - name: Push by digest
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: PORTAL_DOWNLOAD_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env: { DIGEST: "${{ steps.push.outputs.digest }}" }
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Runs only when both platforms passed their smoke test.
  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags are computed, never written by hand. latest follows releases only, so
      # that the one-line start without a tag always pulls the last release.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,format=long
      - name: One tag for both platforms
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          tags=$(jq -r '.tags[] | "-t " + .' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          # shellcheck disable=SC2086,SC2046
          docker buildx imagetools create $tags \
            --annotation "index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "index:org.opencontainers.image.licenses=Apache-2.0" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:sha-${{ github.sha }}"

      # GHCR keeps the package's visibility apart from the repository's. The one-line
      # start works without `docker login` only when the package is public; say so here
      # rather than on the target machine.
      - name: Can it be pulled without login?
        run: |
          set -uo pipefail
          repo="${IMAGE#ghcr.io/}"
          token=$(curl -s "https://ghcr.io/token?scope=repository:$repo:pull" | jq -r '.token // empty')
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            "https://ghcr.io/v2/$repo/manifests/sha-${{ github.sha }}")
          if [ "$code" = 200 ]; then
            echo "::notice::$IMAGE is public: pulling needs no login."
          else
            echo "::warning::$IMAGE is not public (anonymous pull answered $code). Pulling needs docker login until the package is set to public in its settings on GitHub."
          fi
